<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=430, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>STEP III · The Ascent</title>
<style>
  :root {
    --bg: #050810;
    --bg-1: #0a0f1e;
    --bg-2: #111729;
    --bg-3: #1a2138;
    --border: #243049;
    --border-strong: #2f3d5c;
    --border-glow: #3d5288;
    --text: #e8edf7;
    --text-dim: #8a96b0;
    --text-muted: #5c6680;
    --accent: #d4af37;
    --accent-bright: #f4cf57;
    --accent-dim: #8a7220;
    --accent-glow: rgba(212, 175, 55, 0.5);
    --xp: #60a5fa;
    --xp-glow: rgba(96, 165, 250, 0.5);
    --success: #4ade80;
    --success-glow: rgba(74, 222, 128, 0.5);
    --warn: #f59e0b;
    --danger: #ef4444;
    --info: #60a5fa;
    --boss: #a855f7;
    --boss-glow: rgba(168, 85, 247, 0.6);
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }

  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Iowan Old Style', 'Palatino', 'Times New Roman', serif;
    font-size: 16px;
    line-height: 1.5;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    padding-top: var(--safe-top);
    padding-bottom: calc(var(--safe-bottom) + 80px);
    background:
      radial-gradient(ellipse at 50% -10%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 0% 30%, rgba(96, 165, 250, 0.04) 0%, transparent 50%),
      linear-gradient(180deg, #050810 0%, #020409 100%);
    background-attachment: fixed;
  }

  /* Animated grid backdrop */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(212, 175, 55, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212, 175, 55, 0.025) 1px, transparent 1px);
    background-size: 30px 30px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);
  }

  .wrap {
    position: relative;
    z-index: 1;
  }

  /* ===========================================
     HEADER — Hunter Status Window
     =========================================== */
  .header {
    padding: 20px 20px 0;
    position: relative;
  }

  .system-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'SF Mono', 'Monaco', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
    font-weight: 600;
  }

  .system-tag::before {
    content: '◆';
    color: var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .title {
    font-size: 32px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -1px;
    margin-bottom: 4px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #f4cf57 0%, #d4af37 50%, #8a7220 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .title-sub {
    font-style: italic;
    font-family: 'Iowan Old Style', serif;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-bottom: 16px;
  }

  /* ---------- HUNTER STATS BLOCK ---------- */
  .hunter-block {
    background: linear-gradient(135deg, rgba(26, 33, 56, 0.95), rgba(10, 15, 30, 0.95));
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 16px;
    margin: 0 20px 16px;
    position: relative;
    overflow: hidden;
  }

  .hunter-block::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .hunter-block::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-glow), transparent);
  }

  .hunter-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    align-items: center;
    margin-bottom: 14px;
  }

  .rank-badge {
    width: 56px; height: 56px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Iowan Old Style', serif;
    font-size: 30px;
    font-weight: 700;
    color: var(--bg);
    font-style: italic;
    position: relative;
    box-shadow:
      0 0 20px var(--accent-glow),
      inset 0 1px 0 rgba(255,255,255,0.3);
  }

  .rank-badge::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-bright), transparent, var(--accent-dim));
    z-index: -1;
  }

  .hunter-info {
    flex: 1;
    min-width: 0;
  }

  .hunter-name {
    font-size: 15px;
    color: var(--text);
    font-weight: 500;
    margin-bottom: 2px;
  }

  .hunter-class {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .level-block {
    text-align: right;
  }

  .level-num {
    font-size: 28px;
    color: var(--accent);
    font-style: italic;
    line-height: 1;
    font-weight: 300;
  }

  .level-label {
    font-family: 'SF Mono', monospace;
    font-size: 8px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* XP bar */
  .xp-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .xp-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--xp);
    text-transform: uppercase;
    font-weight: 600;
  }

  .xp-num {
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    color: var(--text);
  }

  .xp-num em {
    color: var(--xp);
    font-style: normal;
    font-weight: 600;
  }

  .xp-bar {
    height: 8px;
    background: var(--bg);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
  }

  .xp-fill {
    height: 100%;
    background: linear-gradient(90deg, #2563eb, #60a5fa, #93c5fd);
    border-radius: 4px;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 12px var(--xp-glow);
    position: relative;
  }

  .xp-fill::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 30px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4));
    border-radius: 4px;
  }

  /* Stats triplet */
  .stats-triplet {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .stat-cell {
    text-align: center;
  }

  .stat-num {
    font-size: 18px;
    color: var(--text);
    font-style: italic;
    font-weight: 400;
    line-height: 1;
  }

  .stat-num.gold { color: var(--accent); }
  .stat-num.green { color: var(--success); }
  .stat-num.red { color: var(--danger); }
  .stat-num.amber { color: var(--warn); }

  .stat-label {
    font-family: 'SF Mono', monospace;
    font-size: 8px;
    letter-spacing: 1px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ===========================================
     BOSS COUNTDOWN BANNER (NBMEs / Test)
     =========================================== */
  .boss-banner {
    margin: 0 20px 16px;
    padding: 14px 16px;
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(168, 85, 247, 0.05));
    border: 1px solid rgba(168, 85, 247, 0.4);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    animation: bossGlow 3s ease-in-out infinite;
  }

  @keyframes bossGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.2); }
    50% { box-shadow: 0 0 30px rgba(168, 85, 247, 0.4); }
  }

  .boss-banner.test {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(239, 68, 68, 0.08));
    border-color: rgba(212, 175, 55, 0.5);
    animation: testGlow 2s ease-in-out infinite;
  }

  @keyframes testGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
    50% { box-shadow: 0 0 40px rgba(212, 175, 55, 0.5); }
  }

  .boss-eyebrow {
    font-family: 'SF Mono', monospace;
    font-size: 8.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--boss);
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .boss-banner.test .boss-eyebrow { color: var(--accent); }

  .boss-eyebrow::before {
    content: '⚔';
    font-size: 12px;
  }

  .boss-banner.test .boss-eyebrow::before { content: '★'; }

  .boss-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .boss-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.2;
  }

  .boss-name em {
    font-style: italic;
    color: var(--boss);
  }

  .boss-banner.test .boss-name em { color: var(--accent); }

  .boss-meta {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .boss-countdown {
    text-align: right;
    flex-shrink: 0;
  }

  .boss-days {
    font-size: 28px;
    font-style: italic;
    line-height: 1;
    color: var(--boss);
    font-weight: 300;
  }

  .boss-banner.test .boss-days { color: var(--accent); }

  .boss-days-label {
    font-family: 'SF Mono', monospace;
    font-size: 8px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* ===========================================
     SECTION TABS (Today / Plan / Stats)
     =========================================== */
  .main-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    margin: 0 20px 0;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
  }

  .main-tab {
    padding: 10px;
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    border: none;
    background: transparent;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.2s;
    min-height: 44px;
    font-weight: 600;
  }

  .main-tab.active {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
    color: var(--accent);
    box-shadow: inset 0 0 0 1px rgba(212, 175, 55, 0.3);
  }

  /* ===========================================
     TODAY SECTION
     =========================================== */
  .panel {
    display: none;
    padding: 20px;
    animation: fadeIn 0.3s ease;
  }

  .panel.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .today-header {
    margin-bottom: 16px;
  }

  .today-eyebrow {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 4px;
  }

  .today-date {
    font-size: 24px;
    font-weight: 400;
    line-height: 1.1;
  }

  .today-date em {
    font-style: italic;
    color: var(--accent);
  }

  .today-meta {
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* Quick action buttons */
  .quick-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }

  .qa-btn {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    text-align: left;
    min-height: 44px;
    transition: all 0.2s;
  }

  .qa-btn:active {
    transform: scale(0.97);
    background: var(--bg-3);
  }

  .qa-btn-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .qa-btn-action {
    font-size: 13px;
    color: var(--text);
  }

  .qa-btn-action em {
    color: var(--accent);
    font-style: italic;
    font-weight: 500;
  }

  /* Section labels */
  .section-label {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 24px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
  }

  .section-label:first-child { margin-top: 0; }

  .section-label .count {
    margin-left: auto;
    color: var(--text-dim);
    font-weight: 400;
    font-size: 9px;
  }

  /* TASK CARDS */
  .task {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    min-height: 44px;
    transition: all 0.2s;
    position: relative;
  }

  .task:active {
    transform: scale(0.99);
  }

  .task.done {
    background: var(--bg-1);
    opacity: 0.55;
  }

  .task.done .task-text {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  .checkbox {
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--border-strong);
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    transition: all 0.2s;
    background: var(--bg-3);
  }

  .task.done .checkbox {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .checkbox::after {
    content: '';
    width: 5px;
    height: 9px;
    border: solid var(--bg);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) scale(0);
    margin-top: -2px;
    transition: transform 0.2s;
  }

  .task.done .checkbox::after {
    transform: rotate(45deg) scale(1);
  }

  .task-content {
    flex: 1;
    min-width: 0;
  }

  .task-text {
    font-size: 14px;
    line-height: 1.4;
    color: var(--text);
  }

  .task-meta {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .xp-tag {
    display: inline-block;
    padding: 2px 6px;
    background: rgba(96, 165, 250, 0.15);
    color: var(--xp);
    border-radius: 4px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border: 1px solid rgba(96, 165, 250, 0.3);
  }

  .task.priority {
    border-left: 3px solid var(--accent);
  }

  .task.assessment {
    border-left: 3px solid var(--boss);
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.08), var(--bg-2));
  }

  .task.assessment .task-meta { color: var(--boss); }

  .task.boss {
    border-left: 3px solid var(--accent);
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), var(--bg-2));
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-style: italic;
  }

  .empty-state-icon {
    font-size: 32px;
    color: var(--accent);
    margin-bottom: 12px;
  }

  /* Tomorrow preview */
  .tomorrow-section {
    margin-top: 32px;
    padding: 16px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    border-left: 3px solid var(--text-dim);
  }

  .tomorrow-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .tomorrow-preview-task {
    font-size: 13px;
    color: var(--text-dim);
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }

  .tomorrow-preview-task:last-child { border-bottom: none; }

  /* ===========================================
     PLAN PANEL — Week Cards
     =========================================== */
  .week-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: all 0.3s;
  }

  .week-card.current {
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
  }

  .week-card.past {
    opacity: 0.55;
  }

  .week-card-header {
    padding: 14px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    transition: background 0.2s;
  }

  .week-card-header:active {
    background: var(--bg-3);
  }

  .week-num-badge {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--bg-3);
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-family: 'Iowan Old Style', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--text-dim);
    font-weight: 400;
  }

  .week-card.current .week-num-badge {
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    color: var(--bg);
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .week-card.completed .week-num-badge {
    background: var(--success);
    color: var(--bg);
    border-color: var(--success);
  }

  .week-card.completed .week-num-badge::before {
    content: '✓';
    font-style: normal;
    font-weight: 700;
  }

  .week-card.completed .week-num-badge .num-text {
    display: none;
  }

  .week-card-info {
    flex: 1;
    min-width: 0;
  }

  .week-card-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.2;
  }

  .week-card-title em {
    font-style: italic;
    color: var(--accent);
  }

  .week-card.past .week-card-title em { color: var(--text-dim); }

  .week-card-dates {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .week-card-progress {
    flex-shrink: 0;
    text-align: right;
  }

  .week-card-pct {
    font-size: 13px;
    color: var(--accent);
    font-style: italic;
    font-weight: 500;
  }

  .week-card.past .week-card-pct { color: var(--text-dim); }

  .week-card-pct-label {
    font-family: 'SF Mono', monospace;
    font-size: 8px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 1px;
  }

  .week-card-body {
    display: none;
    padding: 0 16px 16px;
    border-top: 1px solid var(--border);
  }

  .week-card.expanded .week-card-body {
    display: block;
  }

  .week-card.expanded .week-card-header {
    padding-bottom: 12px;
  }

  /* Week info pill */
  .week-pills {
    display: flex;
    gap: 6px;
    margin: 12px 0;
    flex-wrap: wrap;
  }

  .week-pill {
    padding: 4px 10px;
    background: var(--bg-3);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    font-weight: 600;
  }

  .week-pill.gold {
    border-color: rgba(212, 175, 55, 0.4);
    color: var(--accent);
    background: rgba(212, 175, 55, 0.05);
  }

  /* Sub-section in expanded week */
  .sub-section {
    margin-top: 14px;
  }

  .sub-section-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
    font-weight: 600;
  }

  /* Day group inside week */
  .day-group {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 6px;
  }

  .day-group-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .day-group-name {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--accent);
    text-transform: uppercase;
    font-weight: 600;
  }

  .day-group-date {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
  }

  .day-task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 6px 0;
    cursor: pointer;
    min-height: 36px;
  }

  .day-task .checkbox {
    width: 18px;
    height: 18px;
  }

  .day-task .checkbox::after {
    width: 4px;
    height: 7px;
  }

  .day-task .task-text {
    font-size: 13px;
    line-height: 1.35;
  }

  .day-task .task-meta {
    font-size: 9px;
  }

  .day-task.done .task-text {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  .day-task.done .checkbox {
    background: var(--accent);
    border-color: var(--accent);
  }

  /* Note boxes in expanded weeks */
  .note-box {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.08), rgba(212, 175, 55, 0.02));
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 12px;
    margin: 12px 0;
  }

  .note-label {
    font-family: 'SF Mono', monospace;
    font-size: 8.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
    font-weight: 700;
  }

  .note-text {
    font-size: 12px;
    line-height: 1.5;
    color: var(--text);
  }

  .note-box.warn {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.08), rgba(245, 158, 11, 0.02));
    border-color: rgba(245, 158, 11, 0.25);
    border-left-color: var(--warn);
  }

  .note-box.warn .note-label { color: var(--warn); }

  .note-box.info {
    background: linear-gradient(135deg, rgba(96, 165, 250, 0.08), rgba(96, 165, 250, 0.02));
    border-color: rgba(96, 165, 250, 0.25);
    border-left-color: var(--info);
  }

  .note-box.info .note-label { color: var(--info); }

  /* ===========================================
     STATS PANEL
     =========================================== */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }

  .stat-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
    background: var(--accent);
  }

  .stat-card.xp::before { background: var(--xp); }
  .stat-card.green::before { background: var(--success); }
  .stat-card.warn::before { background: var(--warn); }
  .stat-card.danger::before { background: var(--danger); }

  .stat-card-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .stat-card-value {
    font-size: 24px;
    color: var(--text);
    font-style: italic;
    font-weight: 400;
    line-height: 1;
  }

  .stat-card-value.gold { color: var(--accent); }
  .stat-card-value.xp-color { color: var(--xp); }
  .stat-card-value.green { color: var(--success); }
  .stat-card-value.warn { color: var(--warn); }
  .stat-card-value.danger { color: var(--danger); }

  .stat-card-sub {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* Pace gauge */
  .pace-gauge {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .pace-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .pace-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--accent);
    text-transform: uppercase;
    font-weight: 700;
  }

  .pace-value {
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    color: var(--text);
  }

  .pace-bar {
    height: 10px;
    background: var(--bg);
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
    margin-bottom: 6px;
  }

  .pace-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent), var(--accent-bright));
    border-radius: 5px;
    transition: width 0.6s ease;
    box-shadow: 0 0 8px var(--accent-glow);
  }

  .pace-fill.behind { background: linear-gradient(90deg, #b45309, var(--warn)); box-shadow: 0 0 8px rgba(245, 158, 11, 0.4); }
  .pace-fill.danger { background: linear-gradient(90deg, #991b1b, var(--danger)); box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
  .pace-fill.green { background: linear-gradient(90deg, #15803d, var(--success)); box-shadow: 0 0 8px var(--success-glow); }

  .pace-marker {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 4px;
  }

  /* Counter widget for QBank/CCS */
  .counter-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }

  .counter-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .counter-title {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }

  .counter-progress {
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    color: var(--text);
  }

  .counter-progress em {
    color: var(--accent);
    font-style: normal;
    font-weight: 600;
  }

  .counter-bar {
    height: 8px;
    background: var(--bg);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--border);
    margin-bottom: 12px;
  }

  .counter-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  .counter-bar-fill.qb {
    background: linear-gradient(90deg, #2563eb, #60a5fa);
    box-shadow: 0 0 8px var(--xp-glow);
  }

  .counter-bar-fill.ccs {
    background: linear-gradient(90deg, #7c3aed, #a78bfa);
    box-shadow: 0 0 8px var(--boss-glow);
  }

  .counter-buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .counter-btn {
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--bg-3);
    color: var(--text);
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    min-height: 44px;
    transition: all 0.15s;
  }

  .counter-btn:active {
    transform: scale(0.95);
    background: var(--accent-dim);
    color: var(--bg);
    border-color: var(--accent);
  }

  .counter-btn.minus {
    color: var(--text-dim);
  }

  /* Reset button */
  .reset-row {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    text-align: center;
  }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    min-height: 44px;
    margin: 0 4px;
  }

  .reset-btn:active {
    background: var(--bg-3);
  }

  .reset-btn.danger {
    color: var(--danger);
    border-color: rgba(239, 68, 68, 0.3);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-3);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 12px 18px;
    border-radius: 12px;
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    box-shadow: 0 0 20px var(--accent-glow);
    white-space: nowrap;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-10px);
  }

  .toast .xp-gain {
    color: var(--xp);
    font-weight: 700;
  }

  /* ===========================================
     Q-TASK STEPPER (partial credit UI)
     =========================================== */
  .task.q-task {
    display: block;
    padding: 12px 14px;
  }

  .task.q-task .q-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .task.q-task .task-content {
    margin-bottom: 8px;
  }

  .q-stepper {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 8px;
    align-items: center;
    padding: 10px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-top: 8px;
  }

  .q-step-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--bg-3);
    color: var(--text);
    font-family: 'SF Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .q-step-btn:active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--bg);
  }

  .q-step-btn.minus {
    color: var(--text-dim);
  }

  .q-step-display {
    text-align: center;
    padding: 0 4px;
  }

  .q-step-num {
    font-size: 18px;
    color: var(--text);
    font-weight: 500;
    font-family: 'SF Mono', monospace;
  }

  .q-step-num em {
    color: var(--accent);
    font-style: italic;
  }

  .q-step-num.complete em {
    color: var(--success);
  }

  .q-step-num.over em {
    color: var(--xp);
  }

  .q-step-label {
    font-family: 'SF Mono', monospace;
    font-size: 8px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .q-task.complete {
    background: linear-gradient(135deg, rgba(74, 222, 128, 0.08), var(--bg-2));
    border-color: rgba(74, 222, 128, 0.3);
  }

  .q-task.partial {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.05), var(--bg-2));
    border-left: 3px solid var(--warn);
  }

  /* Mini progress bar for stepper */
  .q-mini-bar {
    grid-column: 1 / -1;
    height: 4px;
    background: var(--bg);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 8px;
  }

  .q-mini-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  .q-mini-bar-fill.complete {
    background: var(--success);
  }

  /* ===========================================
     Q-DEBT BADGE & CATCH-UP SECTION
     =========================================== */
  .debt-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(245, 158, 11, 0.15));
    border: 1px solid rgba(245, 158, 11, 0.4);
    border-radius: 10px;
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    color: var(--warn);
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-left: 6px;
  }

  .debt-badge::before {
    content: '⚠';
    font-size: 10px;
  }

  .debt-banner {
    margin: 16px 0;
    padding: 14px;
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.03));
    border: 1px solid rgba(245, 158, 11, 0.3);
    border-left: 3px solid var(--warn);
    border-radius: 10px;
  }

  .debt-banner-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .debt-label {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--warn);
    text-transform: uppercase;
    font-weight: 700;
  }

  .debt-label::before {
    content: '⚠ ';
  }

  .debt-num {
    font-size: 20px;
    color: var(--warn);
    font-style: italic;
    font-weight: 500;
  }

  .debt-text {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .debt-text em {
    color: var(--text);
    font-style: italic;
  }

  /* Catch-up day indicator */
  .catch-up-indicator {
    display: inline-block;
    padding: 2px 6px;
    background: rgba(245, 158, 11, 0.15);
    color: var(--warn);
    font-family: 'SF Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    border-radius: 4px;
    border: 1px solid rgba(245, 158, 11, 0.3);
    font-weight: 700;
    margin-left: 4px;
  }

  .catch-up-suggestion {
    background: var(--bg-1);
    border: 1px dashed rgba(245, 158, 11, 0.4);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.4;
  }

  .catch-up-suggestion em {
    color: var(--warn);
    font-style: italic;
    font-weight: 600;
  }

  /* ===========================================
     ANKI DAILY CARD
     =========================================== */
  .anki-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.08), var(--bg-2));
    border: 1px solid rgba(168, 85, 247, 0.2);
    border-left: 3px solid var(--boss);
    border-radius: 10px;
    margin-bottom: 16px;
    cursor: pointer;
    min-height: 44px;
    transition: all 0.2s;
    position: relative;
  }

  .anki-card:active {
    transform: scale(0.99);
  }

  .anki-card.done {
    background: linear-gradient(135deg, rgba(74, 222, 128, 0.08), var(--bg-2));
    border-color: rgba(74, 222, 128, 0.3);
    border-left-color: var(--success);
  }

  .anki-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--boss), #6d28d9);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
  }

  .anki-card.done .anki-icon {
    background: linear-gradient(135deg, var(--success), #15803d);
    box-shadow: 0 0 12px var(--success-glow);
  }

  .anki-content {
    flex: 1;
    min-width: 0;
  }

  .anki-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.2;
  }

  .anki-card.done .anki-title {
    color: var(--text-dim);
  }

  .anki-meta {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .anki-streak-badge {
    color: var(--boss);
    font-weight: 700;
  }

  .anki-card.done .anki-streak-badge {
    color: var(--success);
  }

  .anki-checkbox {
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--border-strong);
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    background: var(--bg-3);
  }

  .anki-card.done .anki-checkbox {
    background: var(--success);
    border-color: var(--success);
    box-shadow: 0 0 12px var(--success-glow);
  }

  .anki-checkbox::after {
    content: '';
    width: 5px;
    height: 9px;
    border: solid var(--bg);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) scale(0);
    margin-top: -2px;
    transition: transform 0.2s;
  }

  .anki-card.done .anki-checkbox::after {
    transform: rotate(45deg) scale(1);
  }

  /* ===========================================
     WEEKLY PROGRESS WIDGET
     =========================================== */
  .weekly-progress {
    background: linear-gradient(135deg, var(--bg-2), var(--bg-1));
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .weekly-progress::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: 100%;
    background: var(--accent);
  }

  .weekly-progress.on-pace::before { background: var(--success); box-shadow: 0 0 8px var(--success-glow); }
  .weekly-progress.ahead::before { background: var(--xp); box-shadow: 0 0 8px var(--xp-glow); }
  .weekly-progress.slightly-behind::before { background: var(--warn); }
  .weekly-progress.behind::before { background: var(--danger); box-shadow: 0 0 8px rgba(239, 68, 68, 0.5); }

  .wp-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .wp-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--accent);
    text-transform: uppercase;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .wp-label::before {
    content: '⬢';
  }

  .wp-status {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 8px;
  }

  .wp-status.on-pace { background: rgba(74, 222, 128, 0.15); color: var(--success); }
  .wp-status.ahead { background: rgba(96, 165, 250, 0.15); color: var(--xp); }
  .wp-status.slightly-behind { background: rgba(245, 158, 11, 0.15); color: var(--warn); }
  .wp-status.behind { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

  .wp-numbers {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 8px 0 6px;
  }

  .wp-progress-num {
    font-size: 22px;
    color: var(--text);
    font-style: italic;
    font-weight: 400;
    line-height: 1;
  }

  .wp-progress-num em {
    color: var(--accent);
    font-style: italic;
    font-weight: 500;
  }

  .wp-target-num {
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  .wp-bar-container {
    position: relative;
    height: 10px;
    margin: 8px 0 4px;
  }

  .wp-bar {
    height: 100%;
    background: var(--bg);
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
  }

  .wp-bar-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }

  .wp-bar-fill.on-pace {
    background: linear-gradient(90deg, #15803d, var(--success));
    box-shadow: 0 0 8px var(--success-glow);
  }
  .wp-bar-fill.ahead {
    background: linear-gradient(90deg, #2563eb, var(--xp));
    box-shadow: 0 0 10px var(--xp-glow);

    position: absolute;

    left: -3px;
    width: 8px;
    height: 4px;
    background: var(--text);
    border-radius: 2px 2px 0 0;

function parseDateKey(key) {
  return new Date(`${key}T00:00:00`);
}

function dateKey(input) {
  const d = input instanceof Date ? input : new Date(input);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function dateAdd(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}

function dateFmt(d, fmt) {
  const date = d instanceof Date ? d : parseDateKey(d);
  const opts = {
    short: { month: 'short', day: 'numeric' },
    long: { weekday: 'long', month: 'long', day: 'numeric' },
    weekday: { weekday: 'long' },
    weekdayShort: { weekday: 'short' }
  };
  return date.toLocaleDateString('en-US', opts[fmt] || opts.short);
}

function daysBetweenInclusive(startKey, endKey) {
  return Math.floor((parseDateKey(endKey) - parseDateKey(startKey)) / 86400000) + 1;
}

function daysUntil(key) {
  const now = new Date();
  return Math.ceil((parseDateKey(key) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
}

function getCurrentDate() {
  return new Date();
}

function getTodayKey() {
  return dateKey(getCurrentDate());
}

function clamp(n, min, max) {
  return Math.max(min, Math.min(max, Number(n) || 0));
}

// STORAGE + MIGRATION
// ===========================================
function defaultState() {
  return {
    version: 2,
    tasks: {},
    qProgress: {},
    ccsProgress: {},
    xp: 0,
    streakDays: [],
    ankiDays: [],
    practiceActivated: false,
    oldStorageRescued: false
  };
}

function rescueOldStorageOnce(stateObj) {
  if (stateObj.oldStorageRescued) return stateObj;
  try {
    OLD_STORAGE_KEYS.forEach(key => {
      const raw = localStorage.getItem(key);
      if (raw && !localStorage.getItem(`${STORAGE_KEY}_rescue_${key}`)) {
        localStorage.setItem(`${STORAGE_KEY}_rescue_${key}`, raw);
      }
    });
    stateObj.oldStorageRescued = true;
  } catch (e) {
    stateObj.oldStorageRescued = true;
  }
  return stateObj;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return rescueOldStorageOnce({
        ...defaultState(),
        ...parsed,
        tasks: parsed.tasks || {},
        qProgress: parsed.qProgress || {},
        ccsProgress: parsed.ccsProgress || {},
        streakDays: parsed.streakDays || [],
        ankiDays: parsed.ankiDays || []
      });
    }
  } catch (e) {}
  return rescueOldStorageOnce(defaultState());
}

let state = loadState();

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    showToast('Save failed — localStorage unavailable');
  }
}

// PLAN HELPERS
// ===========================================
function getAllTasks() {
  return PLAN_DAYS.flatMap(d => d.tasks.map(t => ({...t, date: d.date, day: d})));
}

function getUWorldTasks() {
  return getAllTasks().filter(t => t.qTarget);
}

function getCcsTasks() {
  return getAllTasks().filter(t => t.ccsTarget);
}

function getDayPlan(key) {
  return PLAN_DAYS.find(d => d.date === key) || null;
}

function getCurrentWeek() {
  const today = getTodayKey();
  return WEEKS.find(w => today >= w.start && today <= w.end)
    || (today < WEEKS[0].start ? WEEKS[0] : WEEKS[WEEKS.length - 1]);
}

function getWeekForDate(key) {
  return WEEKS.find(w => key >= w.start && key <= w.end) || WEEKS[0];
}

function getWeekDays(week) {
  return PLAN_DAYS.filter(d => d.date >= week.start && d.date <= week.end);
}

function getQProgress(id) {
  return clamp(state.qProgress[id] || 0, 0, 999);
}

function getCcsProgress(id) {
  return clamp(state.ccsProgress[id] || 0, 0, 99);
}

function getUWorldCompleted() {
  return clamp(getUWorldTasks().reduce((sum, t) => sum + getQProgress(t.id), 0), 0, UWORLD_TOTAL_REMAINING_TARGET);
}

function getUWorldRemaining() {
  return Math.max(0, UWORLD_TOTAL_REMAINING_TARGET - getUWorldCompleted());
}

function getCcsCompleted() {
  return clamp(getCcsTasks().reduce((sum, t) => sum + getCcsProgress(t.id), 0), 0, CCS_STRETCH);
}

function scheduledUWorldThrough(key) {
  return getUWorldTasks()
    .filter(t => t.date <= key && t.date <= UWORLD_FINISH_TARGET)
    .reduce((sum, t) => sum + t.qTarget, 0);
}

function scheduledCcsThrough(key) {
  return getCcsTasks()
    .filter(t => t.date <= key)
    .reduce((sum, t) => sum + t.ccsTarget, 0);
}

function scheduledUWorldTotal() {
  return getUWorldTasks().reduce((sum, t) => sum + t.qTarget, 0);
}

function scheduledCcsTotal() {
  return getCcsTasks().reduce((sum, t) => sum + t.ccsTarget, 0);
}

function getQDebt() {
  const today = getTodayKey();
  const expectedPast = getUWorldTasks()
    .filter(t => t.date < today && t.date <= UWORLD_FINISH_TARGET)
    .reduce((sum, t) => sum + t.qTarget, 0);

  const pastDone = getUWorldTasks()
    .filter(t => t.date < today)
    .reduce((sum, t) => sum + getQProgress(t.id), 0);

  const todayTasks = getUWorldTasks().filter(t => t.date === today);
  const todayTarget = todayTasks.reduce((sum, t) => sum + t.qTarget, 0);
  const todayDone = todayTasks.reduce((sum, t) => sum + getQProgress(t.id), 0);
  const todayOverflow = Math.max(0, todayDone - todayTarget);

  return Math.max(0, expectedPast - pastDone - todayOverflow);
}

function getCcsDebt() {
  const today = getTodayKey();
  return Math.max(0, scheduledCcsThrough(today) - getCcsCompleted());
}

function getPaceStatus() {
  const today = getTodayKey();
  const qDone = getUWorldCompleted();
  const qExpected = scheduledUWorldThrough(today);
  const qBehind = Math.max(0, qExpected - qDone);
  const ccsDone = getCcsCompleted();
  const ccsExpected = scheduledCcsThrough(today);
  const ccsBehind = Math.max(0, ccsExpected - ccsDone);

  let status = 'On Pace';
  let cls = 'green';
  if (qBehind > 100) { status = 'Practice Test Skipped'; cls = 'danger'; }
  else if (qBehind > 40) { status = 'Behind'; cls = 'behind'; }
  else if (ccsBehind > 8 && today > UWORLD_FINISH_TARGET) { status = 'CCS Behind'; cls = 'behind'; }
  else if (qDone >= UWORLD_TOTAL_REMAINING_TARGET && ccsDone >= scheduledCcsThrough(today)) { status = 'Ahead'; cls = 'green'; }
  return {status, cls, qBehind, ccsBehind, qExpected, ccsExpected};
}

function practiceAllowed() {
  const p = getPaceStatus();
  const today = getTodayKey();
  const qDone = getUWorldCompleted();
  const ccsDone = getCcsCompleted();
  const ccsExpectedByPractice = scheduledCcsThrough('2026-06-21');
  return qDone >= UWORLD_TOTAL_REMAINING_TARGET &&
         ccsDone >= ccsExpectedByPractice - 2 &&
         p.qBehind <= 100 &&
         today <= '2026-06-22';
}

function getCatchUpRecommendation() {
  const debt = getQDebt();
  if (debt <= 0) return null;

  const today = getTodayKey();
  const future = PLAN_DAYS
    .filter(d => d.date >= today && d.date <= UWORLD_FINISH_TARGET)
    .map(d => {
      const hasQ = d.tasks.some(t => t.qTarget);
      const isWeekend = [0,6].includes(parseDateKey(d.date).getDay());
      let priority = 9;
      if (isWeekend) priority = 1;
      else if (['Clinic','Elective','Final Clinic'].includes(d.rotation)) priority = 2;
      else if (d.rotation === 'Nights') priority = 5;
      return {...d, hasQ, isWeekend, priority};
    })
    .filter(d => d.hasQ)
    .sort((a,b) => a.priority - b.priority || a.date.localeCompare(b.date));

  const target = future[0];
  if (!target) return {text: `No protected catch-up window left. Today needs +${debt} questions or the schedule slips.`};
  const cap = target.rotation === 'Nights' ? Math.min(10, debt) : Math.min(30, debt);
  return {text: `Move +${cap} catch-up questions to ${dateFmt(target.date, 'weekdayShort')} ${dateFmt(target.date, 'short')}. Prefer weekend/off-day first; do not load nights unless unavoidable.`};
}

function getTotalTasks() {
  return getAllTasks().length + PLAN_DAYS.length; // includes daily Anki/review card
}

function getDoneTasks() {
  let done = Object.values(state.tasks).filter(Boolean).length;
  done += state.ankiDays.filter(d => d >= PLAN_START && d <= TEST_DATE_2).length;
  return done;
}

function getProgressPct() {
  const qPct = getUWorldCompleted() / UWORLD_TOTAL_REMAINING_TARGET;
  const ccsPct = Math.min(1, getCcsCompleted() / CCS_TARGET);
  return Math.round(((qPct * 0.55) + (ccsPct * 0.30) + ((getDoneTasks() / Math.max(1, getTotalTasks())) * 0.15)) * 100);
}

function getRank() {
  const pct = getProgressPct();
  for (let i = RANKS.length - 1; i >= 0; i--) {
    if (pct >= RANKS[i].min) return RANKS[i];
  }
  return RANKS[0];
}

function getLevel() {
  const xp = state.xp || 0;
  const thresholds = [0, 250, 600, 1100, 1800, 2700, 3800, 5100, 6600, 8300];
  let level = 1;
  for (let i = 0; i < thresholds.length; i++) {
    if (xp >= thresholds[i]) level = i + 1;
  }
  if (level >= 10) return {level: 10, xpInLevel: 0, xpNeeded: 1, max: true};
  return {level, xpInLevel: xp - thresholds[level-1], xpNeeded: thresholds[level] - thresholds[level-1]};
}

function isAnkiDoneOnDate(key) {
  return state.ankiDays.includes(key);
}

function calcAnkiStreak() {
  let streak = 0;
  let d = parseDateKey(getTodayKey());
  if (!isAnkiDoneOnDate(dateKey(d))) d = dateAdd(d, -1);
  while (true) {
    const k = dateKey(d);
    if (state.ankiDays.includes(k)) {
      streak++;
      d = dateAdd(d, -1);
    } else break;
  }
  return streak;
}

function calcCurrentStreak() {
  let streak = 0;
  let d = parseDateKey(getTodayKey());
  while (true) {
    const k = dateKey(d);
    if (state.streakDays.includes(k) || state.ankiDays.includes(k)) {
      streak++;
      d = dateAdd(d, -1);
    } else {
      if (streak === 0 && k === getTodayKey()) {
        d = dateAdd(d, -1);
        continue;
      }
      break;
    }
  }
  return streak;
}

function updateStreakForDate(key) {
  const plan = getDayPlan(key);
  if (!plan) return;
  const anyTask = plan.tasks.some(t => state.tasks[t.id] || getQProgress(t.id) > 0 || getCcsProgress(t.id) > 0);
  const anyAnki = state.ankiDays.includes(key);
  if ((anyTask || anyAnki) && !state.streakDays.includes(key)) state.streakDays.push(key);
  if (!anyTask && !anyAnki && state.streakDays.includes(key)) state.streakDays = state.streakDays.filter(d => d !== key);
}

function renderHeader() {
  const today = getCurrentDate();
  document.getElementById('dateString').textContent = dateFmt(today, 'long').toUpperCase();
}

function renderHunter() {
  const rank = getRank();
  const level = getLevel();
  const pct = getProgressPct();

  document.getElementById('rankBadge').textContent = rank.letter;
  document.getElementById('levelNum').textContent = level.level;
  document.getElementById('hunterClass').textContent = `PGY-2 · IM · ${rank.label}`;
  document.getElementById('xpCurrent').textContent = level.max ? '∞' : level.xpInLevel;
  document.getElementById('xpMax').textContent = level.max ? '∞' : level.xpNeeded;
  document.getElementById('xpFill').style.width = (level.max ? 100 : Math.min(100, level.xpInLevel / level.xpNeeded * 100)) + '%';
  document.getElementById('stat-streak').textContent = calcCurrentStreak();
  document.getElementById('stat-tasks').textContent = getDoneTasks();
  document.getElementById('stat-pct').textContent = pct + '%';
}

function renderBossBanner() {
  const banner = document.getElementById('bossBanner');
  const bosses = [
    {name:'UWorld Finish Target', date: UWORLD_FINISH_TARGET, type:'uworld'},
    ...(state.practiceActivated ? [{name:'Optional Practice Test', date:'2026-06-21', type:'nbme'}] : []),
    {name:'Day 1 (FIP)', date: TEST_DATE, type:'test'},
    {name:'Day 2 (ACM + CCS)', date: TEST_DATE_2, type:'test'}
  ];
  const today = getTodayKey();
  const next = bosses.find(b => b.date >= today);
  if (!next) { banner.innerHTML = ''; return; }
  const days = daysUntil(next.date);
  if (days > 14 && next.type !== 'uworld') { banner.innerHTML = ''; return; }
  const isTest = next.type === 'test';
  const cls = isTest ? 'boss-banner test' : 'boss-banner';
  const eyebrow = next.type === 'uworld' ? 'Milestone Approaching' : (isTest ? 'Final Boss Approaching' : 'Optional Boss');
  banner.innerHTML = `
    <div class="${cls}">
      <div class="boss-eyebrow">${eyebrow}</div>
      <div class="boss-row">
        <div>
          <div class="boss-name"><em>${next.name}</em></div>
          <div class="boss-meta">${dateFmt(next.date, 'long')}</div>
        </div>
        <div class="boss-countdown">
          <div class="boss-days">${days}</div>
          <div class="boss-days-label">${days === 1 ? 'Day' : 'Days'}</div>
        </div>
      </div>
    </div>`;
}

  const today = getTodayKey();
  const pace = getPaceStatus();
  const qDone = getUWorldCompleted();
  const ccsDone = getCcsCompleted();
  const qPct = Math.min(100, qDone / UWORLD_TOTAL_REMAINING_TARGET * 100);
  const ccsPct = Math.min(100, ccsDone / CCS_TARGET * 100);

  return `
    <div class="weekly-progress ${pace.cls === 'danger' ? 'behind' : pace.cls}">
      <div class="wp-header">
        <div class="wp-label">Final Pace</div>
        <div class="wp-status ${pace.cls === 'danger' ? 'behind' : pace.cls}">${pace.status}</div>
      </div>
      <div class="wp-numbers">
        <div class="wp-progress-num"><em>${qDone}</em> / 1021 Qs</div>
        <div class="wp-target-num">${getUWorldRemaining()} remaining</div>
      </div>
      <div class="wp-bar-container"><div class="wp-bar"><div class="wp-bar-fill ${pace.cls === 'danger' ? 'behind' : pace.cls}" style="width:${qPct}%"></div></div></div>
      <div class="wp-footer"><span>UWorld target: Jun 20</span><span class="wp-delta ${pace.qBehind > 100 ? 'danger' : pace.qBehind > 0 ? 'negative' : 'positive'}">${pace.qBehind > 0 ? '-' + pace.qBehind + ' behind' : 'On pace'}</span></div>
      <div class="wp-numbers" style="margin-top:14px;">
        <div class="wp-progress-num"><em>${ccsDone}</em> / 60 CCS</div>
        <div class="wp-target-num">min 40 · stretch 80</div>
      </div>
      <div class="wp-bar-container"><div class="wp-bar"><div class="wp-bar-fill ${pace.ccsBehind > 0 ? 'slightly-behind' : 'on-pace'}" style="width:${ccsPct}%"></div></div></div>
      <div class="wp-footer"><span>CCS target: by Jun 28</span><span class="wp-delta ${pace.ccsBehind > 0 ? 'negative' : 'positive'}">${pace.ccsBehind > 0 ? '-' + pace.ccsBehind + ' behind' : 'On pace'}</span></div>
    </div>`;
}

function renderToday() {
  const today = getTodayKey();
  const plan = getDayPlan(today);
  const todayDate = getCurrentDate();
  const tasksEl = document.getElementById('todayTasks');
  const tomorrowSec = document.getElementById('tomorrowSection');

  if (!plan) {
    document.getElementById('todayEyebrow').textContent = today < PLAN_START ? '— Plan starts soon —' : '— Plan complete —';
    document.getElementById('todayDate').innerHTML = `<em>${dateFmt(todayDate, 'weekday')}</em>, ${dateFmt(todayDate, 'short')}`;
    document.getElementById('todayMeta').textContent = today < PLAN_START ? 'Final plan begins Tuesday, May 26' : 'You are beyond the schedule window.';
    tasksEl.innerHTML = `<div class="empty-state"><div class="empty-state-icon">◆</div>${today < PLAN_START ? 'The final push starts May 26.' : 'Plan complete.'}</div>`;
    tomorrowSec.style.display = 'none';
    return;
  }

  document.getElementById('todayEyebrow').textContent = `${plan.phase}`;
  document.getElementById('todayDate').innerHTML = `<em>${dateFmt(todayDate, 'weekday')}</em>, ${dateFmt(todayDate, 'short')}`;
  document.getElementById('todayMeta').textContent = `${plan.rotation} · ${plan.type.toUpperCase()}`;

  let html = renderProgressWidget();

  const debt = getQDebt();
  const rec = getCatchUpRecommendation();
  if (debt > 0) {
    html += `<div class="debt-banner">
      <div class="debt-banner-header"><div class="debt-label">Q-Debt</div><div class="debt-num">+${debt}</div></div>
      <div class="debt-text">${rec ? rec.text : 'Clear this before adding optional work.'}</div>
    </div>`;
  }

  if (getPaceStatus().qBehind > 100) {
    html += `<div class="note-box warn"><div class="note-label">Practice Test Skipped</div><div class="note-text">You are >100 questions behind. The optional practice test should be skipped until unused UWorld and CCS are back on pace.</div></div>`;
  }

  if (today >= '2026-06-20' && getCcsDebt() > 0) {
    html += `<div class="note-box warn"><div class="note-label">CCS Now Beats Incorrects</div><div class="note-text">After UWorld finish week, CCS catch-up has priority over incorrects. Minimum acceptable target is 40; ideal is 60.</div></div>`;
  }

  const ankiDone = isAnkiDoneOnDate(today);
  html += `
    <div class="anki-card ${ankiDone ? 'done' : ''}" onclick="toggleAnki('${today}')">
      <div class="anki-icon">🃏</div>
      <div class="anki-content">
        <div class="anki-title">${ankiDone ? 'Anki review — checked today' : 'Check off Anki review'}</div>
        <div class="anki-meta"><span class="xp-tag">+10 XP</span><span>Anki streak: ${calcAnkiStreak()} day${calcAnkiStreak() === 1 ? '' : 's'}</span></div>
      </div>
      <div class="anki-checkbox"></div>
    </div>`;

  const doneToday = plan.tasks.filter(t => state.tasks[t.id] || (t.qTarget && getQProgress(t.id) >= t.qTarget) || (t.ccsTarget && getCcsProgress(t.id) >= t.ccsTarget)).length;
  html += `<div class="section-label">⚔ Today's Watch <span class="count">${doneToday}/${plan.tasks.length}</span></div>`;
  plan.tasks.forEach(t => html += renderTaskHTML(t));
  tasksEl.innerHTML = html;

  const tomorrow = dateKey(dateAdd(todayDate, 1));
  const tPlan = getDayPlan(tomorrow);
  if (tPlan) {
    document.getElementById('tomorrowTasks').innerHTML =
      `<div style="margin-bottom: 8px; color: var(--text); font-size: 13px;"><strong>${dateFmt(tomorrow, 'weekday')}, ${dateFmt(tomorrow, 'short')}</strong> <span style="color: var(--text-muted); font-family: 'SF Mono', monospace; font-size: 9px;">· ${tPlan.rotation.toUpperCase()}</span></div>` +
      tPlan.tasks.map(t => `<div class="tomorrow-preview-task">• ${t.text} ${t.qTarget ? '(' + t.meta + ')' : ''}</div>`).join('');
    tomorrowSec.style.display = 'block';
  } else {
    tomorrowSec.style.display = 'none';
  }
}

function renderTaskHTML(t) {
  if (t.qTarget) return renderQTaskHTML(t);
  if (t.ccsTarget) return renderCcsTaskHTML(t);
  return renderBinaryTaskHTML(t);
}

function renderQTaskHTML(t) {
  const progress = getQProgress(t.id);
  const pct = Math.min(100, progress / t.qTarget * 100);
  const complete = progress >= t.qTarget;
  const partial = progress > 0 && !complete;
  const classes = ['task','q-task'];
  if (complete) classes.push('complete');
  else if (partial) classes.push('partial');
  if (t.priority) classes.push('priority');

  return `
    <div class="${classes.join(' ')}">
      <div class="q-row">
        <div class="checkbox" onclick="toggleQTaskComplete('${t.id}', ${t.qTarget}, ${t.xp || 25}, '${t.date}')"></div>
        <div class="task-content">
          <div class="task-text">${t.text}</div>
          <div class="task-meta"><span class="xp-tag">+${t.xp || 25} XP</span><span>${t.meta}</span><span>target: ${t.qTarget}</span></div>
        </div>
      </div>
      <div class="q-stepper">
        <button class="q-step-btn minus" onclick="adjustQProgress('${t.id}', -5, ${t.qTarget}, '${t.date}')">−5</button>
        <div class="q-step-display">
          <div class="q-step-num ${complete ? 'complete' : ''}"><em>${progress}</em> / ${t.qTarget}</div>
          <div class="q-step-label">unused questions</div>
        </div>
        <button class="q-step-btn" onclick="adjustQProgress('${t.id}', 5, ${t.qTarget}, '${t.date}')">+5</button>
        <div class="q-mini-bar"><div class="q-mini-bar-fill ${complete ? 'complete' : ''}" style="width:${pct}%"></div></div>
      </div>
    </div>`;
}

function renderCcsTaskHTML(t) {
  const progress = getCcsProgress(t.id);
  const pct = Math.min(100, progress / t.ccsTarget * 100);
  const complete = progress >= t.ccsTarget;
  const partial = progress > 0 && !complete;
  const classes = ['task','q-task'];
  if (complete) classes.push('complete');
  else if (partial) classes.push('partial');
  if (t.priority) classes.push('priority');

  return `
    <div class="${classes.join(' ')}">
      <div class="q-row">
        <div class="checkbox" onclick="toggleCcsTaskComplete('${t.id}', ${t.ccsTarget}, ${t.xp || 30}, '${t.date}')"></div>
        <div class="task-content">
          <div class="task-text">${t.text}</div>
          <div class="task-meta"><span class="xp-tag">+${t.xp || 30} XP</span><span>${t.meta}</span><span>target: ${t.ccsTarget}</span></div>
        </div>
      </div>
      <div class="q-stepper">
        <button class="q-step-btn minus" onclick="adjustCcsProgress('${t.id}', -1, ${t.ccsTarget}, '${t.date}')">−1</button>
        <div class="q-step-display">
          <div class="q-step-num ${complete ? 'complete' : ''}"><em>${progress}</em> / ${t.ccsTarget}</div>
          <div class="q-step-label">CCS cases</div>
        </div>
        <button class="q-step-btn" onclick="adjustCcsProgress('${t.id}', 1, ${t.ccsTarget}, '${t.date}')">+1</button>
        <div class="q-mini-bar"><div class="q-mini-bar-fill ${complete ? 'complete' : ''}" style="width:${pct}%"></div></div>
      </div>
    </div>`;
}

function renderBinaryTaskHTML(t) {
  let text = t.text;
  let meta = t.meta || '';
  let extraClass = '';
  if (t.kind === 'optional') {
    if (practiceAllowed()) {
      text = 'Activate optional practice test';
      meta = 'Allowed: UWorld complete and CCS on pace. Tap to activate/show boss banner.';
    } else {
      text = 'Optional practice test · skip unless criteria met';
      meta = 'Locked unless UWorld is complete and CCS is on pace; automatically deprioritized if behind.';
      extraClass = ' priority';
    }
  }

  const done = !!state.tasks[t.id];
  const classes = ['task'];
  if (done) classes.push('done');
  if (t.priority || extraClass) classes.push('priority');
  if (t.assessment) classes.push('assessment');

  return `
    <div class="${classes.join(' ')}" onclick="toggleTask('${t.id}', ${t.xp || 10}, '${t.date}', '${t.kind || 'task'}')">
      <div class="checkbox"></div>
      <div class="task-content">
        <div class="task-text">${text}</div>
        <div class="task-meta"><span class="xp-tag">+${t.xp || 10} XP</span>${meta ? `<span>${meta}</span>` : ''}</div>
      </div>
    </div>`;
}

function renderPlan() {
  const container = document.getElementById('planContent');
  const today = getTodayKey();
  let html = '';

  WEEKS.forEach(w => {
    const days = getWeekDays(w);
    const tasks = days.flatMap(d => d.tasks);
    const total = tasks.length;
    const done = tasks.filter(t => state.tasks[t.id] || (t.qTarget && getQProgress(t.id) >= t.qTarget) || (t.ccsTarget && getCcsProgress(t.id) >= t.ccsTarget)).length;
    const pct = total ? Math.round(done / total * 100) : 0;
    const current = today >= w.start && today <= w.end;
    const past = w.end < today;
    const qTotal = tasks.filter(t => t.qTarget).reduce((s,t)=>s+t.qTarget,0);
    const cTotal = tasks.filter(t => t.ccsTarget).reduce((s,t)=>s+t.ccsTarget,0);
    const classes = ['week-card'];
    if (current) classes.push('current','expanded');
    if (past && !current) classes.push('past');
    if (pct === 100) classes.push('completed');

    html += `
      <div class="${classes.join(' ')}" id="week-${w.n}">
        <div class="week-card-header" onclick="toggleWeek(${w.n})">
          <div class="week-num-badge"><span class="num-text">${w.n}</span></div>
          <div class="week-card-info">
            <div class="week-card-title">Week ${w.n} · <em>${w.title}</em></div>
            <div class="week-card-dates">${dateFmt(w.start,'short')} – ${dateFmt(w.end,'short')} · ${w.rotation}</div>
          </div>
          <div class="week-card-progress"><div class="week-card-pct">${pct}%</div><div class="week-card-pct-label">${done}/${total}</div></div>
        </div>
        <div class="week-card-body">
          <div class="week-pills">
            <span class="week-pill gold">${qTotal} UWorld</span>
            <span class="week-pill">${cTotal} CCS</span>
            <span class="week-pill">${w.summary}</span>
          </div>
          ${weekNoteHTML(w.n)}
          <div class="sub-section">
            <div class="sub-section-label">Daily Quests</div>
            ${days.map(d => `
              <div class="day-group">
                <div class="day-group-header"><div class="day-group-name">${d.label} · ${d.type}</div><div class="day-group-date">${dateFmt(d.date,'short')}</div></div>
                ${d.tasks.map(t => renderTaskHTML(t)).join('')}
              </div>`).join('')}
          </div>
        </div>
      </div>`;
  });

  container.innerHTML = html;
}

function weekNoteHTML(n) {
  const notes = {
    1: ['Short calendar week', 'The app now groups weeks Sunday–Saturday. Because the plan starts Tuesday, Week 1 is intentionally shortened to Tue–Sat instead of pretending it is a full week.'],
    2: ['Clinic to elective', 'This week crosses rotations because calendar weeks start Sunday. Weekend/off-day capacity absorbs catch-up before nights.'],
    3: ['Elective to nights', 'The second half of the week is survival mode. Keep nights to small chunks and do not let catch-up destroy sleep.'],
    4: ['Finish then pivot', 'First-pass UWorld ends June 20. After that, CCS and weak-area review beat incorrects.'],
    5: ['Taper + Day 1', 'No new first-pass UWorld. Optional practice test only if UWorld is done and CCS is on pace.'],
    6: ['Recovery + Day 2', 'June 28 is recovery plus CCS polish, not a panic grind. June 29 is the final boss.']
  }[n] || ['Calendar week', 'Sunday-start calendar grouping.'];
  return `<div class="note-box info"><div class="note-label">${notes[0]}</div><div class="note-text">${notes[1]}</div></div>`;
}

// ===========================================
// INTERACTIONS
// ===========================================
function awardXP(amount, label) {
  state.xp = (state.xp || 0) + Math.max(0, amount || 0);
  saveState();
  if (amount > 0) showToast(`<span class="xp-gain">+${amount} XP</span> ${label || ''}`);
}

function deductXP(amount) {
  state.xp = Math.max(0, (state.xp || 0) - Math.max(0, amount || 0));
  saveState();
}

function toggleTask(id, xp, date, kind) {
  const wasDone = !!state.tasks[id];

  if (kind === 'optional') {
    if (!practiceAllowed()) {
      state.practiceActivated = false;
      showToast('Optional test skipped — finish UWorld + CCS first');
      saveState();
      rerender();
      return;
    }
    state.practiceActivated = !state.practiceActivated;
  }

  state.tasks[id] = !wasDone;
  if (state.tasks[id]) awardXP(xp || 10, 'Quest complete');
  else deductXP(xp || 10);
  updateStreakForDate(date || getTodayKey());
  saveState();
  rerender();
}

function adjustQProgress(id, delta, target, date) {
  const old = getQProgress(id);
  const max = UWORLD_TOTAL_REMAINING_TARGET;
  let val = Math.max(0, old + delta);

  const otherDone = getUWorldTasks()
    .filter(t => t.id !== id)
    .reduce((sum, t) => sum + getQProgress(t.id), 0);
  val = Math.min(val, Math.max(0, max - otherDone));

  state.qProgress[id] = val;
  state.tasks[id] = val >= target;

  if (delta > 0 && val > old) awardXP(Math.floor((val - old) / 5), `+${val - old} Qs`);
  if (delta < 0 && old > val) deductXP(Math.floor((old - val) / 5));
  updateStreakForDate(date || getTodayKey());
  saveState();
  rerender();
}

function toggleQTaskComplete(id, target, xp, date) {
  const current = getQProgress(id);
  if (current >= target) {
    state.qProgress[id] = 0;
    state.tasks[id] = false;
    deductXP(xp || 10);
  } else {
    adjustQProgress(id, target - current, target, date);
    return;
  }
  updateStreakForDate(date || getTodayKey());
  saveState();
  rerender();
}

function adjustCcsProgress(id, delta, target, date) {
  const old = getCcsProgress(id);
  let val = Math.max(0, old + delta);
  const otherDone = getCcsTasks().filter(t => t.id !== id).reduce((sum, t) => sum + getCcsProgress(t.id), 0);
  val = Math.min(val, Math.max(0, CCS_STRETCH - otherDone));
  state.ccsProgress[id] = val;
  state.tasks[id] = val >= target;
  if (delta > 0 && val > old) awardXP((val - old) * 15, `+${val - old} CCS`);
  if (delta < 0 && old > val) deductXP((old - val) * 15);
  updateStreakForDate(date || getTodayKey());
  saveState();
  rerender();
}

function toggleCcsTaskComplete(id, target, xp, date) {
  const current = getCcsProgress(id);
  if (current >= target) {
    state.ccsProgress[id] = 0;
    state.tasks[id] = false;
    deductXP(xp || 10);
  } else {
    adjustCcsProgress(id, target - current, target, date);
    return;
  }
  updateStreakForDate(date || getTodayKey());
  saveState();
  rerender();
}

function getTodayPrimaryQTask() {
  const plan = getDayPlan(getTodayKey());
  return plan ? plan.tasks.find(t => t.qTarget) : null;
}

function getTodayPrimaryCcsTask() {
  const plan = getDayPlan(getTodayKey());
  return plan ? plan.tasks.find(t => t.ccsTarget) : null;
}

function adjustQbank(delta) {
  const task = getTodayPrimaryQTask() || getUWorldTasks().find(t => getQProgress(t.id) < t.qTarget);
  if (task) adjustQProgress(task.id, delta, task.qTarget, task.date);
}

function adjustCcsGlobal(delta) {
  const task = getTodayPrimaryCcsTask() || getCcsTasks().find(t => getCcsProgress(t.id) < t.ccsTarget);
  if (task) adjustCcsProgress(task.id, delta, task.ccsTarget, task.date);
}

function quickQbank() { adjustQbank(25); }
function quickCCS() { adjustCcsGlobal(1); }

function toggleAnki(date) {
  const key = date || getTodayKey();
  if (state.ankiDays.includes(key)) {
    state.ankiDays = state.ankiDays.filter(d => d !== key);
    deductXP(10);
  } else {
    state.ankiDays.push(key);
    awardXP(10, 'Daily review');
  }
  updateStreakForDate(key);
  saveState();
  rerender();
}

function toggleWeek(n) {
  const card = document.getElementById('week-' + n);
  if (card) card.classList.toggle('expanded');
}

function switchTab(name) {
  document.querySelectorAll('.main-tab').forEach((t, i) => {
    const tabName = ['today', 'plan', 'stats'][i];
    t.classList.toggle('active', tabName === name);
  });
  document.querySelectorAll('.panel').forEach(p => {
    p.classList.toggle('active', p.id === 'panel-' + name);
  });
}

function resetCurrentWeek() {
  const cw = getCurrentWeek();
  if (!confirm(`Reset all checkboxes for Week ${cw.n} (${cw.title})?`)) return;
  getWeekDays(cw).forEach(d => {
    d.tasks.forEach(t => {
      delete state.tasks[t.id];
      if (t.qTarget) delete state.qProgress[t.id];
      if (t.ccsTarget) delete state.ccsProgress[t.id];
    });
    state.ankiDays = state.ankiDays.filter(x => x !== d.date);
    state.streakDays = state.streakDays.filter(x => x !== d.date);
  });
  saveState();
  rerender();
}

function resetAll() {
  if (!confirm('Reset ALL final-plan data? Old rescued data stays preserved separately.')) return;
  state = rescueOldStorageOnce(defaultState());
  saveState();
  rerender();
}

let toastTimer = null;
function showToast(html) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.innerHTML = html;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function rerender() {
  renderHeader();
  renderHunter();
  renderBossBanner();
  renderToday();
  renderPlan();
  renderStats();
}

// Arithmetic guardrails — if these ever fail, the schedule is wrong.
console.assert(scheduledUWorldTotal() === 1021, 'UWorld schedule must sum to 1021');
console.assert(scheduledCcsTotal() === 60, 'CCS schedule must sum to 60');
console.assert(TEST_DATE === '2026-06-27', 'Day 1 date mismatch');
console.assert(TEST_DATE_2 === '2026-06-29', 'Day 2 date mismatch');

saveState();
rerender();

setInterval(() => {
  renderHeader();
  renderBossBanner();
}, 60000);

</script>
