<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=430, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>STEP III · The Ascent</title>
<style>
  :root {
    --bg: #050810;
    --bg-1: #0a0f1e;
    --bg-2: #111729;
    --bg-3: #1a2138;
    --border: #243049;
    --border-strong: #2f3d5c;
    --border-glow: #3d5288;
    --text: #e8edf7;
    --text-dim: #8a96b0;
    --text-muted: #5c6680;
    --accent: #d4af37;
    --accent-bright: #f4cf57;
    --accent-dim: #8a7220;
    --accent-glow: rgba(212, 175, 55, 0.5);
    --xp: #60a5fa;
    --xp-glow: rgba(96, 165, 250, 0.5);
    --success: #4ade80;
    --success-glow: rgba(74, 222, 128, 0.5);
    --warn: #f59e0b;
    --danger: #ef4444;
    --info: #60a5fa;
    --boss: #a855f7;
    --boss-glow: rgba(168, 85, 247, 0.6);
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }

  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Iowan Old Style', 'Palatino', 'Times New Roman', serif;
    font-size: 16px;
    line-height: 1.5;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    padding-top: var(--safe-top);
    padding-bottom: calc(var(--safe-bottom) + 80px);
    background:
      radial-gradient(ellipse at 50% -10%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 0% 30%, rgba(96, 165, 250, 0.04) 0%, transparent 50%),
      linear-gradient(180deg, #050810 0%, #020409 100%);
    background-attachment: fixed;
  }

  /* Animated grid backdrop */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(212, 175, 55, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212, 175, 55, 0.025) 1px, transparent 1px);
    background-size: 30px 30px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);
  }

  .wrap {
    position: relative;
    z-index: 1;
  }

  /* ===========================================
     HEADER — Hunter Status Window
     =========================================== */
  .header {
    padding: 20px 20px 0;
    position: relative;
  }

  .system-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'SF Mono', 'Monaco', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
    font-weight: 600;
  }

  .system-tag::before {
    content: '◆';
    color: var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .title {
    font-size: 32px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -1px;
    margin-bottom: 4px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #f4cf57 0%, #d4af37 50%, #8a7220 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .title-sub {
    font-style: italic;
    font-family: 'Iowan Old Style', serif;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-bottom: 16px;
  }

  /* ---------- HUNTER STATS BLOCK ---------- */
  .hunter-block {
    background: linear-gradient(135deg, rgba(26, 33, 56, 0.95), rgba(10, 15, 30, 0.95));
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 16px;
    margin: 0 20px 16px;
    position: relative;
    overflow: hidden;
  }

  .hunter-block::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .hunter-block::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-glow), transparent);
  }

  .hunter-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    align-items: center;
    margin-bottom: 14px;
  }

  .rank-badge {
    width: 56px; height: 56px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Iowan Old Style', serif;
    font-size: 30px;
    font-weight: 700;
    color: var(--bg);
    font-style: italic;
    position: relative;
    box-shadow:
      0 0 20px var(--accent-glow),
      inset 0 1px 0 rgba(255,255,255,0.3);
  }

  .rank-badge::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-bright), transparent, var(--accent-dim));
    z-index: -1;
  }

  .hunter-info {
    flex: 1;
    min-width: 0;
  }

  .hunter-name {
    font-size: 15px;
    color: var(--text);
    font-weight: 500;
    margin-bottom: 2px;
  }

  .hunter-class {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .level-block {
    text-align: right;
  }

  .level-num {
    font-size: 28px;
    color: var(--accent);
    font-style: italic;
    line-height: 1;
    font-weight: 300;
  }

  .level-label {
    font-family: 'SF Mono', monospace;
    font-size: 8px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* XP bar */
  .xp-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .xp-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--xp);
    text-transform: uppercase;
    font-weight: 600;
  }

  .xp-num {
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    color: var(--text);
  }

  .xp-num em {
    color: var(--xp);
    font-style: normal;
    font-weight: 600;
  }

  .xp-bar {
    height: 8px;
    background: var(--bg);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
  }

  .xp-fill {
    height: 100%;
    background: linear-gradient(90deg, #2563eb, #60a5fa, #93c5fd);
    border-radius: 4px;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 12px var(--xp-glow);
    position: relative;
  }

  .xp-fill::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 30px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4));
    border-radius: 4px;
  }

  /* Stats triplet */
  .stats-triplet {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .stat-cell {
    text-align: center;
  }

  .stat-num {
    font-size: 18px;
    color: var(--text);
    font-style: italic;
    font-weight: 400;
    line-height: 1;
  }

  .stat-num.gold { color: var(--accent); }
  .stat-num.green { color: var(--success); }
  .stat-num.red { color: var(--danger); }
  .stat-num.amber { color: var(--warn); }

  .stat-label {
    font-family: 'SF Mono', monospace;
    font-size: 8px;
    letter-spacing: 1px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ===========================================
     BOSS COUNTDOWN BANNER (NBMEs / Test)
     =========================================== */
  .boss-banner {
    margin: 0 20px 16px;
    padding: 14px 16px;
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(168, 85, 247, 0.05));
    border: 1px solid rgba(168, 85, 247, 0.4);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    animation: bossGlow 3s ease-in-out infinite;
  }

  @keyframes bossGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.2); }
    50% { box-shadow: 0 0 30px rgba(168, 85, 247, 0.4); }
  }

  .boss-banner.test {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(239, 68, 68, 0.08));
    border-color: rgba(212, 175, 55, 0.5);
    animation: testGlow 2s ease-in-out infinite;
  }

  @keyframes testGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
    50% { box-shadow: 0 0 40px rgba(212, 175, 55, 0.5); }
  }

  .boss-eyebrow {
    font-family: 'SF Mono', monospace;
    font-size: 8.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--boss);
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .boss-banner.test .boss-eyebrow { color: var(--accent); }

  .boss-eyebrow::before {
    content: '⚔';
    font-size: 12px;
  }

  .boss-banner.test .boss-eyebrow::before { content: '★'; }

  .boss-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .boss-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.2;
  }

  .boss-name em {
    font-style: italic;
    color: var(--boss);
  }

  .boss-banner.test .boss-name em { color: var(--accent); }

  .boss-meta {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .boss-countdown {
    text-align: right;
    flex-shrink: 0;
  }

  .boss-days {
    font-size: 28px;
    font-style: italic;
    line-height: 1;
    color: var(--boss);
    font-weight: 300;
  }

  .boss-banner.test .boss-days { color: var(--accent); }

  .boss-days-label {
    font-family: 'SF Mono', monospace;
    font-size: 8px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* ===========================================
     SECTION TABS (Today / Plan / Stats)
     =========================================== */
  .main-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    margin: 0 20px 0;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
  }

  .main-tab {
    padding: 10px;
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    border: none;
    background: transparent;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.2s;
    min-height: 44px;
    font-weight: 600;
  }

  .main-tab.active {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
    color: var(--accent);
    box-shadow: inset 0 0 0 1px rgba(212, 175, 55, 0.3);
  }

  /* ===========================================
     TODAY SECTION
     =========================================== */
  .panel {
    display: none;
    padding: 20px;
    animation: fadeIn 0.3s ease;
  }

  .panel.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .today-header {
    margin-bottom: 16px;
  }

  .today-eyebrow {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 4px;
  }

  .today-date {
    font-size: 24px;
    font-weight: 400;
    line-height: 1.1;
  }

  .today-date em {
    font-style: italic;
    color: var(--accent);
  }

  .today-meta {
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* Quick action buttons */
  .quick-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }

  .qa-btn {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    text-align: left;
    min-height: 44px;
    transition: all 0.2s;
  }

  .qa-btn:active {
    transform: scale(0.97);
    background: var(--bg-3);
  }

  .qa-btn-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .qa-btn-action {
    font-size: 13px;
    color: var(--text);
  }

  .qa-btn-action em {
    color: var(--accent);
    font-style: italic;
    font-weight: 500;
  }

  /* Section labels */
  .section-label {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 24px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
  }

  .section-label:first-child { margin-top: 0; }

  .section-label .count {
    margin-left: auto;
    color: var(--text-dim);
    font-weight: 400;
    font-size: 9px;
  }

  /* TASK CARDS */
  .task {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    min-height: 44px;
    transition: all 0.2s;
    position: relative;
  }

  .task:active {
    transform: scale(0.99);
  }

  .task.done {
    background: var(--bg-1);
    opacity: 0.55;
  }

  .task.done .task-text {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  .checkbox {
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--border-strong);
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    transition: all 0.2s;
    background: var(--bg-3);
  }

  .task.done .checkbox {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .checkbox::after {
    content: '';
    width: 5px;
    height: 9px;
    border: solid var(--bg);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) scale(0);
    margin-top: -2px;
    transition: transform 0.2s;
  }

  .task.done .checkbox::after {
    transform: rotate(45deg) scale(1);
  }

  .task-content {
    flex: 1;
    min-width: 0;
  }

  .task-text {
    font-size: 14px;
    line-height: 1.4;
    color: var(--text);
  }

  .task-meta {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .xp-tag {
    display: inline-block;
    padding: 2px 6px;
    background: rgba(96, 165, 250, 0.15);
    color: var(--xp);
    border-radius: 4px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border: 1px solid rgba(96, 165, 250, 0.3);
  }

  .task.priority {
    border-left: 3px solid var(--accent);
  }

  .task.assessment {
    border-left: 3px solid var(--boss);
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.08), var(--bg-2));
  }

  .task.assessment .task-meta { color: var(--boss); }

  .task.boss {
    border-left: 3px solid var(--accent);
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), var(--bg-2));
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-style: italic;
  }

  .empty-state-icon {
    font-size: 32px;
    color: var(--accent);
    margin-bottom: 12px;
  }

  /* Tomorrow preview */
  .tomorrow-section {
    margin-top: 32px;
    padding: 16px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    border-left: 3px solid var(--text-dim);
  }

  .tomorrow-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .tomorrow-preview-task {
    font-size: 13px;
    color: var(--text-dim);
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }

  .tomorrow-preview-task:last-child { border-bottom: none; }

  /* ===========================================
     PLAN PANEL — Week Cards
     =========================================== */
  .week-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: all 0.3s;
  }

  .week-card.current {
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
  }

  .week-card.past {
    opacity: 0.55;
  }

  .week-card-header {
    padding: 14px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    transition: background 0.2s;
  }

  .week-card-header:active {
    background: var(--bg-3);
  }

  .week-num-badge {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--bg-3);
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-family: 'Iowan Old Style', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--text-dim);
    font-weight: 400;
  }

  .week-card.current .week-num-badge {
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    color: var(--bg);
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .week-card.completed .week-num-badge {
    background: var(--success);
    color: var(--bg);
    border-color: var(--success);
  }

  .week-card.completed .week-num-badge::before {
    content: '✓';
    font-style: normal;
    font-weight: 700;
  }

  .week-card.completed .week-num-badge .num-text {
    display: none;
  }

  .week-card-info {
    flex: 1;
    min-width: 0;
  }

  .week-card-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.2;
  }

  .week-card-title em {
    font-style: italic;
    color: var(--accent);
  }

  .week-card.past .week-card-title em { color: var(--text-dim); }

  .week-card-dates {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .week-card-progress {
    flex-shrink: 0;
    text-align: right;
  }

  .week-card-pct {
    font-size: 13px;
    color: var(--accent);
    font-style: italic;
    font-weight: 500;
  }

  .week-card.past .week-card-pct { color: var(--text-dim); }

  .week-card-pct-label {
    font-family: 'SF Mono', monospace;
    font-size: 8px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 1px;
  }

  .week-card-body {
    display: none;
    padding: 0 16px 16px;
    border-top: 1px solid var(--border);
  }

  .week-card.expanded .week-card-body {
    display: block;
  }

  .week-card.expanded .week-card-header {
    padding-bottom: 12px;
  }

  /* Week info pill */
  .week-pills {
    display: flex;
    gap: 6px;
    margin: 12px 0;
    flex-wrap: wrap;
  }

  .week-pill {
    padding: 4px 10px;

<script>
// ===========================================
// CONFIG & DATA
// ===========================================
const TEST_DATE = new Date('2026-06-27T08:00:00');
const TEST_DATE_2 = new Date('2026-06-30T08:00:00');
const PLAN_START = new Date('2026-04-29T00:00:00');
const STORAGE_KEY = 'step3_tracker_v2';

// XP per task type
const XP_TASK = 10;
const XP_PRIORITY = 25;
const XP_ASSESSMENT = 100;
const XP_DAY_COMPLETE = 50;

// Rank thresholds (% complete)
const RANKS = [
  { letter: 'E', min: 0, label: 'Recruit' },
  { letter: 'D', min: 12, label: 'Trainee' },
  { letter: 'C', min: 25, label: 'Apprentice' },
  { letter: 'B', min: 40, label: 'Journeyman' },
  { letter: 'A', min: 55, label: 'Specialist' },
  { letter: 'S', min: 70, label: 'Master' },
  { letter: 'S+', min: 85, label: 'Grandmaster' },
  { letter: 'SSS', min: 95, label: 'Sovereign' }
];

// Helpers for date manipulation
function dateAdd(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}

function dateKey(d) {
  return d.toISOString().split('T')[0];
}

function dateFmt(d, fmt) {
  const opts = {
    short: { month: 'short', day: 'numeric' },
    long: { weekday: 'long', month: 'long', day: 'numeric' },
    weekday: { weekday: 'long' },
    weekdayShort: { weekday: 'short' }
  };
  return d.toLocaleDateString('en-US', opts[fmt]);
}

// ===========================================
// PLAN STRUCTURE - Day-by-day
// Week 1: Wed Apr 29 - Sun May 3 (5 days, partial)
// Week 2: Mon May 4 - Sun May 10
// ... etc
// ===========================================

function makeWeek(n, start, end, title, rotation, dailyQ, weeklyQ, dayPlans, notes) {
  return { n, start, end, title, rotation, dailyQ, weeklyQ, dayPlans, notes };
}

// Day plan helper: type can be 'study', 'rest', 'assessment', 'test', 'recovery'
function day(dateStr, label, type, tasks) {
  return { date: dateStr, label, type, tasks };
}

const WEEKS = [
  // ============ WEEK 1: Apr 29 (Wed) - May 3 (Sun) ============
  {
    n: 1, title: "Awakening",
    start: '2026-04-29', end: '2026-05-03',
    rotation: 'Wards · Week 1 of 3',
    dailyQ: '20–25', weeklyQ: '~110 Qs (partial week)',
    dayPlans: [
      day('2026-04-29', 'Wed', 'study', [
        { id: 'd_2026-04-29_1', text: 'UWorld Qs (random, tutored)', meta: '~75 min', xp: 25, qTarget: 20 },
        { id: 'd_2026-04-29_2', text: 'Review all Qs (correct + incorrect)', xp: 10 },
        { id: 'd_2026-04-29_3', text: 'Schedule NBME Free 120 for May 9–10', meta: 'PRIORITY · do this today', xp: 25, priority: true }

// ===========================================
// STORAGE
// ===========================================
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return {
        tasks: parsed.tasks || {},
        qProgress: parsed.qProgress || {},
        qbank: parsed.qbank ?? 715,
        ccs: parsed.ccs ?? 0,
        xp: parsed.xp ?? 0,
        streakDays: parsed.streakDays || [],
        completedDays: parsed.completedDays || []
      };
    }
  } catch (e) {}
  return {
    tasks: {},
    qProgress: {},
    qbank: 715, // real number from user
    ccs: 0,
    xp: 0,
    streakDays: [],
    completedDays: []
  };
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

let state = loadState();

// ===========================================
// CALCULATIONS
// ===========================================
function getAllTasks() {
  const all = [];
  WEEKS.forEach(w => {
    w.dayPlans.forEach(dp => {
      dp.tasks.forEach(t => all.push({ ...t, date: dp.date, weekN: w.n }));
    });
  });
  return all;
}

function getTotalTasks() {
  return getAllTasks().length;
}

function getDoneTasks() {
  return Object.values(state.tasks).filter(v => v).length;
}

function getProgressPct() {
  const total = getTotalTasks();
  if (total === 0) return 0;
  return Math.round((getDoneTasks() / total) * 100);
}

function getRank() {
  const pct = getProgressPct();
  for (let i = RANKS.length - 1; i >= 0; i--) {
    if (pct >= RANKS[i].min) return RANKS[i];
  }
  return RANKS[0];
}

function getLevel() {
  // Level up every 250 XP, with diminishing curve later
  const xp = state.xp;
  if (xp < 250) return { level: 1, xpInLevel: xp, xpNeeded: 250 };
  if (xp < 600) return { level: 2, xpInLevel: xp - 250, xpNeeded: 350 };
  if (xp < 1100) return { level: 3, xpInLevel: xp - 600, xpNeeded: 500 };
  if (xp < 1800) return { level: 4, xpInLevel: xp - 1100, xpNeeded: 700 };
  if (xp < 2700) return { level: 5, xpInLevel: xp - 1800, xpNeeded: 900 };
  if (xp < 3800) return { level: 6, xpInLevel: xp - 2700, xpNeeded: 1100 };
  if (xp < 5100) return { level: 7, xpInLevel: xp - 3800, xpNeeded: 1300 };
  if (xp < 6600) return { level: 8, xpInLevel: xp - 5100, xpNeeded: 1500 };
  if (xp < 8300) return { level: 9, xpInLevel: xp - 6600, xpNeeded: 1700 };
  return { level: 10, xpInLevel: 0, xpNeeded: 1, max: true };
}

function getCurrentDate() {
  return new Date(); // real time
}

function getTodayKey() {
  return dateKey(getCurrentDate());
}

function getDayPlan(dateKeyStr) {
  for (const w of WEEKS) {
    for (const dp of w.dayPlans) {
      if (dp.date === dateKeyStr) return { week: w, dayPlan: dp };
    }
  }
  return null;
}

function getCurrentWeek() {
  const today = getTodayKey();
  for (const w of WEEKS) {
    if (today >= w.start && today <= w.end) return w;
  }
  // Before plan start
  if (today < WEEKS[0].start) return WEEKS[0];
  // After plan end
  return WEEKS[WEEKS.length - 1];
}

function daysUntil(targetDate) {
  const ms = targetDate - getCurrentDate();
  return Math.ceil(ms / (1000 * 60 * 60 * 24));
}

function getNextBoss() {
  const today = getCurrentDate();
  // Bosses are: NBMEs and test days
  const bosses = [
    { name: 'NBME Free 120', date: new Date('2026-05-09T08:00:00'), type: 'nbme' },
    { name: 'UWSA 1', date: new Date('2026-05-30T08:00:00'), type: 'nbme' },
    { name: 'UWSA 2 / NBME 7', date: new Date('2026-06-06T08:00:00'), type: 'nbme' },
    { name: 'UWSA 3 / NBME 8', date: new Date('2026-06-20T08:00:00'), type: 'nbme' },
    { name: 'Day 1 (CFA)', date: TEST_DATE, type: 'test' },
    { name: 'Day 2 (ACM)', date: TEST_DATE_2, type: 'test' }
  ];
  for (const b of bosses) {
    if (b.date > today) return b;
  }
  return null;
}

function weekProgress(week) {
  let total = 0, done = 0;
  week.dayPlans.forEach(dp => {
    dp.tasks.forEach(t => {
      total++;
      if (state.tasks[t.id]) done++;
    });
  });
  return { total, done, pct: total > 0 ? Math.round((done/total)*100) : 0 };
}

// ===========================================
// Q-DEBT SYSTEM
// ===========================================
// A Q-task has qTarget. Progress tracked in state.qProgress[id].
// Debt = sum of (qTarget - qProgress) for past Q-tasks where progress < target.
// Only counts past (before today) since today/future tasks aren't "owed" yet.

function getQTasks() {
  const all = [];
  WEEKS.forEach(w => {
    w.dayPlans.forEach(dp => {
      dp.tasks.forEach(t => {
        if (t.qTarget && t.qTarget > 0) {
          all.push({ ...t, date: dp.date, weekN: w.n });
        }
      });
    });
  });
  return all;
}

function getQProgress(taskId) {
  return state.qProgress[taskId] || 0;
}

function getQDebt() {
  // Sum of (target - progress) for past Q tasks that aren't fully completed
  const today = getTodayKey();
  let debt = 0;
  getQTasks().forEach(t => {
    if (t.date < today) {
      const progress = getQProgress(t.id);
      const remaining = Math.max(0, t.qTarget - progress);
      debt += remaining;
    }
  });
  return debt;
}

function getCatchUpEligibleDays() {
  // Returns array of upcoming catchUpEligible days that haven't passed
  const today = getTodayKey();
  const result = [];
  WEEKS.forEach(w => {
    w.dayPlans.forEach(dp => {
      if (dp.date >= today) {
        dp.tasks.forEach(t => {
          if (t.catchUpEligible) {
            result.push({ date: dp.date, label: dp.label, taskId: t.id, weekN: w.n });
          }
        });
      }
    });
  });
  return result;
}

function getNextCatchUpDay() {
  const days = getCatchUpEligibleDays();
  return days.length > 0 ? days[0] : null;
}

// Adjust progress on a Q-task. Auto-checks the task if target reached.
function adjustQProgress(taskId, delta, qTarget) {
  const current = getQProgress(taskId);
  const newVal = Math.max(0, current + delta);
  state.qProgress[taskId] = newVal;

  // Auto-update the global QBank counter (so Stats page reflects it)
  if (delta !== 0) {
    state.qbank = Math.max(0, Math.min(2136, state.qbank + delta));
  }

  // Award XP proportionally
  if (delta > 0) {
    awardXP(Math.floor(delta / 5), `+${delta} Qs logged`);
  } else if (delta < 0) {
    deductXP(Math.floor(Math.abs(delta) / 5));
  }

  // Auto-check the task once target reached
  if (newVal >= qTarget && !state.tasks[taskId]) {
    state.tasks[taskId] = true;
    // Award completion XP bonus (find original task XP)
    const task = getQTasks().find(t => t.id === taskId);
    if (task && task.xp) {
      // Already awarded proportional, give a small completion bonus
      awardXP(5, '✓ Task complete');
    }
  } else if (newVal < qTarget && state.tasks[taskId]) {
    // If they decremented below target, uncheck
    state.tasks[taskId] = false;
  }

  updateStreak();
  saveState();
  rerender();
}

// ===========================================
// XP & STREAKS
// ===========================================
function awardXP(amount, label) {
  state.xp += amount;
  saveState();
  showToast(`<span class="xp-gain">+${amount} XP</span> ${label || ''}`);
}

function deductXP(amount) {
  state.xp = Math.max(0, state.xp - amount);
  saveState();
}

function updateStreak() {
  const today = getTodayKey();
  // A day "counts" toward streak if at least one task is done OR Q progress logged
  const todayPlan = getDayPlan(today);
  if (!todayPlan) return;

  const anyDone = todayPlan.dayPlan.tasks.some(t => state.tasks[t.id] || (t.qTarget && getQProgress(t.id) > 0));
  if (anyDone && !state.streakDays.includes(today)) {
    state.streakDays.push(today);
    saveState();
  } else if (!anyDone && state.streakDays.includes(today)) {
    state.streakDays = state.streakDays.filter(d => d !== today);
    saveState();
  }
}

function calcCurrentStreak() {
  // Count back consecutive days from today
  let streak = 0;
  let d = getCurrentDate();
  while (true) {
    const k = dateKey(d);
    if (state.streakDays.includes(k)) {
      streak++;
      d = dateAdd(d, -1);
    } else {
      // Today not yet completed but yesterday was - still count from yesterday
      if (streak === 0 && k === getTodayKey()) {
        d = dateAdd(d, -1);
        continue;
      }
      break;
    }
  }
  return streak;
}

function renderTaskHTML(t, isDay) {
  const isDone = !!state.tasks[t.id];

  // Q-task with stepper
  if (t.qTarget && t.qTarget > 0) {
    const progress = getQProgress(t.id);
    const pct = Math.min(100, (progress / t.qTarget) * 100);
    const isComplete = progress >= t.qTarget;
    const isPartial = progress > 0 && progress < t.qTarget;
    const isOver = progress > t.qTarget;

    const classes = ['task', 'q-task'];
    if (isComplete) classes.push('complete');
    else if (isPartial) classes.push('partial');
    if (t.priority) classes.push('priority');

    const xpTag = t.xp ? `<span class="xp-tag">+${t.xp} XP</span>` : '';
    const numClass = isComplete && !isOver ? 'complete' : (isOver ? 'over' : '');

    return `
      <div class="${classes.join(' ')}">
        <div class="q-row">
          <div class="checkbox" onclick="toggleQTaskComplete('${t.id}', ${t.qTarget}, ${t.xp || 25})"></div>
          <div class="task-content">
            <div class="task-text">${t.text}</div>
            <div class="task-meta">${xpTag}${t.meta ? `<span>${t.meta}</span>` : ''}<span style="color: var(--text-dim);">target: ${t.qTarget}</span></div>
          </div>
        </div>
        <div class="q-stepper">
          <button class="q-step-btn minus" onclick="adjustQProgress('${t.id}', -5, ${t.qTarget})">−5</button>
          <div class="q-step-display">
            <div class="q-step-num ${numClass}"><em>${progress}</em> / ${t.qTarget}</div>
            <div class="q-step-label">questions done</div>
          </div>
          <button class="q-step-btn" onclick="adjustQProgress('${t.id}', 5, ${t.qTarget})">+5</button>
          <div class="q-mini-bar">
            <div class="q-mini-bar-fill ${isComplete ? 'complete' : ''}" style="width: ${pct}%"></div>
          </div>
        </div>
      </div>
    `;
  }

  // Regular binary task
  const classes = ['task'];
  if (isDone) classes.push('done');
  if (t.priority) classes.push('priority');
  if (t.assessment) classes.push('assessment');

  const xpTag = t.xp ? `<span class="xp-tag">+${t.xp} XP</span>` : '';

  return `
    <div class="${classes.join(' ')}" onclick="toggleTask('${t.id}', ${t.xp || 10})">
      <div class="checkbox"></div>
      <div class="task-content">
        <div class="task-text">${t.text}</div>
        <div class="task-meta">${xpTag}${t.meta ? `<span>${t.meta}</span>` : ''}</div>
      </div>
    </div>
  `;
}

// Toggle a Q-task's "complete" checkbox directly (force complete or reset)
function toggleQTaskComplete(id, qTarget, xp) {
  const wasDone = !!state.tasks[id];
  if (wasDone) {
    // Uncheck — reset progress
    state.tasks[id] = false;
    state.qbank = Math.max(0, state.qbank - getQProgress(id));
    state.qProgress[id] = 0;
    deductXP(xp || 10);
  } else {
    // Check — fill to target
    const current = getQProgress(id);
    const remaining = qTarget - current;
    if (remaining > 0) {
      state.qbank = Math.min(2136, state.qbank + remaining);
      state.qProgress[id] = qTarget;
      awardXP(Math.floor(remaining / 5) + 5, '✓ Filled to target');
    } else {
      awardXP(5, '✓ Marked complete');
    }
    state.tasks[id] = true;
  }
  updateStreak();
  saveState();
  rerender();
}

      </div>
    </div>
  `;

  // Lifetime XP
  html += `
    <div class="stats-grid" style="margin-top: 16px;">
      <div class="stat-card xp">
        <div class="stat-card-label">Total XP</div>
        <div class="stat-card-value xp-color">${state.xp.toLocaleString()}</div>
        <div class="stat-card-sub">Lifetime earned</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Plan Progress</div>
        <div class="stat-card-value gold">${getProgressPct()}%</div>
        <div class="stat-card-sub">${doneTasks}/${totalTasks} tasks</div>
      </div>
    </div>
  `;

  container.innerHTML = html;
}

// ===========================================
// INTERACTIONS
// ===========================================
function toggleTask(id, xp) {
  const wasDone = !!state.tasks[id];
  state.tasks[id] = !wasDone;

  if (state.tasks[id]) {
    awardXP(xp || 10);
  } else {
    deductXP(xp || 10);
  }

  updateStreak();
  saveState();
  rerender();
}

function toggleWeek(n) {
  const card = document.getElementById('week-' + n);
  card.classList.toggle('expanded');
}

function adjustQbank(delta) {
  state.qbank = Math.max(0, Math.min(2136, state.qbank + delta));
  saveState();
  if (delta > 0) awardXP(Math.floor(delta / 5), `${delta} Qs logged`);
  rerender();
}

function adjustCcs(delta) {
  state.ccs = Math.max(0, Math.min(30, state.ccs + delta));
  saveState();
  if (delta > 0) awardXP(delta * 15, `${delta} CCS case${delta > 1 ? 's' : ''} logged`);
  rerender();
}

function quickQbank() {
  // Try to add 25 to today's first incomplete Q-task; fall back to global counter
  const today = getTodayKey();
  const plan = getDayPlan(today);
  if (plan) {
    const qTask = plan.dayPlan.tasks.find(t => t.qTarget && getQProgress(t.id) < t.qTarget);
    if (qTask) {
      adjustQProgress(qTask.id, 25, qTask.qTarget);
      return;
    }
  }
  adjustQbank(25);
}
function quickCCS() { adjustCcs(1); }

function switchTab(name) {
  document.querySelectorAll('.main-tab').forEach((t, i) => {
    const tabName = ['today', 'plan', 'stats'][i];
    t.classList.toggle('active', tabName === name);
  });
  document.querySelectorAll('.panel').forEach(p => {
    p.classList.toggle('active', p.id === 'panel-' + name);
  });
}

function resetCurrentWeek() {
  const cw = getCurrentWeek();
  if (!confirm(`Reset all checkboxes for Week ${cw.n} (${cw.title})?`)) return;
  cw.dayPlans.forEach(dp => {
    dp.tasks.forEach(t => { delete state.tasks[t.id]; });
  });
  saveState();
  rerender();
}

function resetAll() {
  if (!confirm('Reset ALL data? This will clear all task progress, XP, and counters. Cannot be undone.')) return;
  if (!confirm('Are you really sure? This will delete everything.')) return;
  state = {
    tasks: {},
    qProgress: {},
    qbank: 715,
    ccs: 0,
    xp: 0,
    streakDays: [],
    completedDays: []
  };
  saveState();
  rerender();
}

// ===========================================
// TOAST
// ===========================================
let toastTimer = null;
function showToast(html) {
  const t = document.getElementById('toast');
  t.innerHTML = html;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ===========================================
// MASTER RERENDER
// ===========================================
function rerender() {
  renderHeader();
  renderHunter();
  renderBossBanner();
  renderToday();
  renderPlan();
  renderStats();
}

// Init
rerender();

// Refresh every minute (for countdown updates)
setInterval(() => {
  renderHeader();
  renderBossBanner();
}, 60000);
</script>
</body>
</html>
