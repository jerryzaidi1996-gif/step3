<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>STEP III · The Ascent</title>
<style>
  :root {
    --bg: #050810;
    --bg-1: #0a0f1e;
    --bg-2: #111729;
    --bg-3: #1a2138;
    --border: #243049;
    --border-strong: #2f3d5c;
    --border-glow: #3d5288;
    --text: #e8edf7;
    --text-dim: #8a96b0;
    --text-muted: #5c6680;
    --accent: #d4af37;
    --accent-bright: #f4cf57;
    --accent-dim: #8a7220;
    --accent-glow: rgba(212, 175, 55, 0.5);
    --xp: #60a5fa;
    --xp-glow: rgba(96, 165, 250, 0.5);
    --success: #4ade80;
    --success-glow: rgba(74, 222, 128, 0.5);
    --warn: #f59e0b;
    --danger: #ef4444;
    --info: #60a5fa;
    --boss: #a855f7;
    --boss-glow: rgba(168, 85, 247, 0.6);
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }

  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Iowan Old Style', 'Palatino', 'Times New Roman', serif;
    font-size: 16px;
    line-height: 1.5;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    padding-top: var(--safe-top);
    padding-bottom: calc(var(--safe-bottom) + 80px);
    background:
      radial-gradient(ellipse at 50% -10%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 0% 30%, rgba(96, 165, 250, 0.04) 0%, transparent 50%),
      linear-gradient(180deg, #050810 0%, #020409 100%);
    background-attachment: fixed;
  }

  /* Animated grid backdrop */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(212, 175, 55, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212, 175, 55, 0.025) 1px, transparent 1px);
    background-size: 30px 30px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);
  }

  .wrap {
    position: relative;
    z-index: 1;
  }

  /* ===========================================
     HEADER — Hunter Status Window
     =========================================== */
  .header {
    padding: 20px 20px 0;
    position: relative;
  }

  .system-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'SF Mono', 'Monaco', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
    font-weight: 600;
  }

  .system-tag::before {
    content: '◆';
    color: var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .title {
    font-size: 32px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -1px;
    margin-bottom: 4px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #f4cf57 0%, #d4af37 50%, #8a7220 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .title-sub {
    font-style: italic;
    font-family: 'Iowan Old Style', serif;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-bottom: 16px;
  }

  /* ---------- HUNTER STATS BLOCK ---------- */
  .hunter-block {
    background: linear-gradient(135deg, rgba(26, 33, 56, 0.95), rgba(10, 15, 30, 0.95));
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 16px;
    margin: 0 20px 16px;
    position: relative;
    overflow: hidden;
  }

  .hunter-block::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .hunter-block::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-glow), transparent);
  }

  .hunter-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    align-items: center;
    margin-bottom: 14px;
  }

  .rank-badge {
    width: 56px; height: 56px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Iowan Old Style', serif;
    font-size: 30px;
    font-weight: 700;
    color: var(--bg);
    font-style: italic;
    position: relative;
    box-shadow:
      0 0 20px var(--accent-glow),
      inset 0 1px 0 rgba(255,255,255,0.3);
  }

  .rank-badge::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-bright), transparent, var(--accent-dim));
    z-index: -1;
  }

  .hunter-info {
    flex: 1;
    min-width: 0;
  }

  .hunter-name {
    font-size: 15px;
    color: var(--text);
    font-weight: 500;
    margin-bottom: 2px;
  }

  .hunter-class {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .level-block {
    text-align: right;
  }

  .level-num {
    font-size: 28px;
    color: var(--accent);
    font-style: italic;
    line-height: 1;
    font-weight: 300;
  }

  .level-label {
    font-family: 'SF Mono', monospace;
    font-size: 8px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* XP bar */
  .xp-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .xp-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--xp);
    text-transform: uppercase;
    font-weight: 600;
  }

  .xp-num {
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    color: var(--text);
  }

  .xp-num em {
    color: var(--xp);
    font-style: normal;
    font-weight: 600;
  }

  .xp-bar {
    height: 8px;
    background: var(--bg);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
  }

  .xp-fill {
    height: 100%;
    background: linear-gradient(90deg, #2563eb, #60a5fa, #93c5fd);
    border-radius: 4px;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 12px var(--xp-glow);
    position: relative;
  }

  .xp-fill::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 30px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4));
    border-radius: 4px;
  }

  /* Stats triplet */
  .stats-triplet {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .stat-cell {
    text-align: center;
  }

  .stat-num {
    font-size: 18px;
    color: var(--text);
    font-style: italic;
    font-weight: 400;
    line-height: 1;
  }

  .stat-num.gold { color: var(--accent); }
  .stat-num.green { color: var(--success); }
  .stat-num.red { color: var(--danger); }
  .stat-num.amber { color: var(--warn); }

  .stat-label {
    font-family: 'SF Mono', monospace;
    font-size: 8px;
    letter-spacing: 1px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ===========================================
     BOSS COUNTDOWN BANNER (NBMEs / Test)
     =========================================== */
  .boss-banner {
    margin: 0 20px 16px;
    padding: 14px 16px;
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(168, 85, 247, 0.05));
    border: 1px solid rgba(168, 85, 247, 0.4);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    animation: bossGlow 3s ease-in-out infinite;
  }

  @keyframes bossGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.2); }
    50% { box-shadow: 0 0 30px rgba(168, 85, 247, 0.4); }
  }

  .boss-banner.test {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(239, 68, 68, 0.08));
    border-color: rgba(212, 175, 55, 0.5);
    animation: testGlow 2s ease-in-out infinite;
  }

  @keyframes testGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
    50% { box-shadow: 0 0 40px rgba(212, 175, 55, 0.5); }
  }

  .boss-eyebrow {
    font-family: 'SF Mono', monospace;
    font-size: 8.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--boss);
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .boss-banner.test .boss-eyebrow { color: var(--accent); }

  .boss-eyebrow::before {
    content: '⚔';
    font-size: 12px;
  }

  .boss-banner.test .boss-eyebrow::before { content: '★'; }

  .boss-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .boss-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.2;
  }

  .boss-name em {
    font-style: italic;
    color: var(--boss);
  }

  .boss-banner.test .boss-name em { color: var(--accent); }

  .boss-meta {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .boss-countdown {
    text-align: right;
    flex-shrink: 0;
  }

  .boss-days {
    font-size: 28px;
    font-style: italic;
    line-height: 1;
    color: var(--boss);
    font-weight: 300;
  }

  .boss-banner.test .boss-days { color: var(--accent); }

  .boss-days-label {
    font-family: 'SF Mono', monospace;
    font-size: 8px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* ===========================================
     SECTION TABS (Today / Plan / Stats)
     =========================================== */
  .main-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    margin: 0 20px 0;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
  }

  .main-tab {
    padding: 10px;
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    border: none;
    background: transparent;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.2s;
    min-height: 44px;
    font-weight: 600;
  }

  .main-tab.active {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
    color: var(--accent);
    box-shadow: inset 0 0 0 1px rgba(212, 175, 55, 0.3);
  }

  /* ===========================================
     TODAY SECTION
     =========================================== */
  .panel {
    display: none;
    padding: 20px;
    animation: fadeIn 0.3s ease;
  }

  .panel.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .today-header {
    margin-bottom: 16px;
  }

  .today-eyebrow {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 4px;
  }

  .today-date {
    font-size: 24px;
    font-weight: 400;
    line-height: 1.1;
  }

  .today-date em {
    font-style: italic;
    color: var(--accent);
  }

  .today-meta {
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* Quick action buttons */
  .quick-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }

  .qa-btn {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    text-align: left;
    min-height: 44px;
    transition: all 0.2s;
  }

  .qa-btn:active {
    transform: scale(0.97);
    background: var(--bg-3);
  }

  .qa-btn-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .qa-btn-action {
    font-size: 13px;
    color: var(--text);
  }

  .qa-btn-action em {
    color: var(--accent);
    font-style: italic;
    font-weight: 500;
  }

  /* Section labels */
  .section-label {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 24px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
  }

  .section-label:first-child { margin-top: 0; }

  .section-label .count {
    margin-left: auto;
    color: var(--text-dim);
    font-weight: 400;
    font-size: 9px;
  }

  /* TASK CARDS */
  .task {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    min-height: 44px;
    transition: all 0.2s;
    position: relative;
  }

  .task:active {
    transform: scale(0.99);
  }

  .task.done {
    background: var(--bg-1);
    opacity: 0.55;
  }

  .task.done .task-text {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  .checkbox {
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--border-strong);
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    transition: all 0.2s;
    background: var(--bg-3);
  }

  .task.done .checkbox {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .checkbox::after {
    content: '';
    width: 5px;
    height: 9px;
    border: solid var(--bg);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) scale(0);
    margin-top: -2px;
    transition: transform 0.2s;
  }

  .task.done .checkbox::after {
    transform: rotate(45deg) scale(1);
  }

  .task-content {
    flex: 1;
    min-width: 0;
  }

  .task-text {
    font-size: 14px;
    line-height: 1.4;
    color: var(--text);
  }

  .task-meta {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .xp-tag {
    display: inline-block;
    padding: 2px 6px;
    background: rgba(96, 165, 250, 0.15);
    color: var(--xp);
    border-radius: 4px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border: 1px solid rgba(96, 165, 250, 0.3);
  }

  .task.priority {
    border-left: 3px solid var(--accent);
  }

  .task.assessment {
    border-left: 3px solid var(--boss);
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.08), var(--bg-2));
  }

  .task.assessment .task-meta { color: var(--boss); }

  .task.boss {
    border-left: 3px solid var(--accent);
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), var(--bg-2));
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-style: italic;
  }

  .empty-state-icon {
    font-size: 32px;
    color: var(--accent);
    margin-bottom: 12px;
  }

  /* Tomorrow preview */
  .tomorrow-section {
    margin-top: 32px;
    padding: 16px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    border-left: 3px solid var(--text-dim);
  }

  .tomorrow-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .tomorrow-preview-task {
    font-size: 13px;
    color: var(--text-dim);
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }

  .tomorrow-preview-task:last-child { border-bottom: none; }

  /* ===========================================
     PLAN PANEL — Week Cards
     =========================================== */
  .week-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: all 0.3s;
  }

  .week-card.current {
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
  }

  .week-card.past {
    opacity: 0.55;
  }

  .week-card-header {
    padding: 14px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    transition: background 0.2s;
  }

  .week-card-header:active {
    background: var(--bg-3);
  }

  .week-num-badge {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--bg-3);
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-family: 'Iowan Old Style', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--text-dim);
    font-weight: 400;
  }

  .week-card.current .week-num-badge {
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    color: var(--bg);
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .week-card.completed .week-num-badge {
    background: var(--success);
    color: var(--bg);
    border-color: var(--success);
  }

  .week-card.completed .week-num-badge::before {
    content: '✓';
    font-style: normal;
    font-weight: 700;
  }

  .week-card.completed .week-num-badge .num-text {
    display: none;
  }

  .week-card-info {
    flex: 1;
    min-width: 0;
  }

  .week-card-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.2;
  }

  .week-card-title em {
    font-style: italic;
    color: var(--accent);
  }

  .week-card.past .week-card-title em { color: var(--text-dim); }

  .week-card-dates {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .week-card-progress {
    flex-shrink: 0;
    text-align: right;
  }

  .week-card-pct {
    font-size: 13px;
    color: var(--accent);
    font-style: italic;
    font-weight: 500;
  }

  .week-card.past .week-card-pct { color: var(--text-dim); }

  .week-card-pct-label {
    font-family: 'SF Mono', monospace;
    font-size: 8px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 1px;
  }

  .week-card-body {
    display: none;
    padding: 0 16px 16px;
    border-top: 1px solid var(--border);
  }

  .week-card.expanded .week-card-body {
    display: block;
  }

  .week-card.expanded .week-card-header {
    padding-bottom: 12px;
  }

  /* Week info pill */
  .week-pills {
    display: flex;
    gap: 6px;
    margin: 12px 0;
    flex-wrap: wrap;
  }

  .week-pill {
    padding: 4px 10px;
    background: var(--bg-3);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    font-weight: 600;
  }

  .week-pill.gold {
    border-color: rgba(212, 175, 55, 0.4);
    color: var(--accent);
    background: rgba(212, 175, 55, 0.05);
  }

  /* Sub-section in expanded week */
  .sub-section {
    margin-top: 14px;
  }

  .sub-section-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
    font-weight: 600;
  }

  /* Day group inside week */
  .day-group {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 6px;
  }

  .day-group-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .day-group-name {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--accent);
    text-transform: uppercase;
    font-weight: 600;
  }

  .day-group-date {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
  }

  .day-task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 6px 0;
    cursor: pointer;
    min-height: 36px;
  }

  .day-task .checkbox {
    width: 18px;
    height: 18px;
  }

  .day-task .checkbox::after {
    width: 4px;
    height: 7px;
  }

  .day-task .task-text {
    font-size: 13px;
    line-height: 1.35;
  }

  .day-task .task-meta {
    font-size: 9px;
  }

  .day-task.done .task-text {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  .day-task.done .checkbox {
    background: var(--accent);
    border-color: var(--accent);
  }

  /* Note boxes in expanded weeks */
  .note-box {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.08), rgba(212, 175, 55, 0.02));
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 12px;
    margin: 12px 0;
  }

  .note-label {
    font-family: 'SF Mono', monospace;
    font-size: 8.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
    font-weight: 700;
  }

  .note-text {
    font-size: 12px;
    line-height: 1.5;
    color: var(--text);
  }

  .note-box.warn {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.08), rgba(245, 158, 11, 0.02));
    border-color: rgba(245, 158, 11, 0.25);
    border-left-color: var(--warn);
  }

  .note-box.warn .note-label { color: var(--warn); }

  .note-box.info {
    background: linear-gradient(135deg, rgba(96, 165, 250, 0.08), rgba(96, 165, 250, 0.02));
    border-color: rgba(96, 165, 250, 0.25);
    border-left-color: var(--info);
  }

  .note-box.info .note-label { color: var(--info); }

  /* ===========================================
     STATS PANEL
     =========================================== */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }

  .stat-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
    background: var(--accent);
  }

  .stat-card.xp::before { background: var(--xp); }
  .stat-card.green::before { background: var(--success); }
  .stat-card.warn::before { background: var(--warn); }
  .stat-card.danger::before { background: var(--danger); }

  .stat-card-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .stat-card-value {
    font-size: 24px;
    color: var(--text);
    font-style: italic;
    font-weight: 400;
    line-height: 1;
  }

  .stat-card-value.gold { color: var(--accent); }
  .stat-card-value.xp-color { color: var(--xp); }
  .stat-card-value.green { color: var(--success); }
  .stat-card-value.warn { color: var(--warn); }
  .stat-card-value.danger { color: var(--danger); }

  .stat-card-sub {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* Pace gauge */
  .pace-gauge {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .pace-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .pace-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--accent);
    text-transform: uppercase;
    font-weight: 700;
  }

  .pace-value {
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    color: var(--text);
  }

  .pace-bar {
    height: 10px;
    background: var(--bg);
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
    margin-bottom: 6px;
  }

  .pace-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent), var(--accent-bright));
    border-radius: 5px;
    transition: width 0.6s ease;
    box-shadow: 0 0 8px var(--accent-glow);
  }

  .pace-fill.behind { background: linear-gradient(90deg, #b45309, var(--warn)); box-shadow: 0 0 8px rgba(245, 158, 11, 0.4); }
  .pace-fill.danger { background: linear-gradient(90deg, #991b1b, var(--danger)); box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
  .pace-fill.green { background: linear-gradient(90deg, #15803d, var(--success)); box-shadow: 0 0 8px var(--success-glow); }

  .pace-marker {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 4px;
  }

  /* Counter widget for QBank/CCS */
  .counter-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }

  .counter-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .counter-title {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }

  .counter-progress {
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    color: var(--text);
  }

  .counter-progress em {
    color: var(--accent);
    font-style: normal;
    font-weight: 600;
  }

  .counter-bar {
    height: 8px;
    background: var(--bg);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--border);
    margin-bottom: 12px;
  }

  .counter-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  .counter-bar-fill.qb {
    background: linear-gradient(90deg, #2563eb, #60a5fa);
    box-shadow: 0 0 8px var(--xp-glow);
  }

  .counter-bar-fill.ccs {
    background: linear-gradient(90deg, #7c3aed, #a78bfa);
    box-shadow: 0 0 8px var(--boss-glow);
  }

  .counter-buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .counter-btn {
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--bg-3);
    color: var(--text);
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    min-height: 44px;
    transition: all 0.15s;
  }

  .counter-btn:active {
    transform: scale(0.95);
    background: var(--accent-dim);
    color: var(--bg);
    border-color: var(--accent);
  }

  .counter-btn.minus {
    color: var(--text-dim);
  }

  /* Reset button */
  .reset-row {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    text-align: center;
  }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    min-height: 44px;
    margin: 0 4px;
  }

  .reset-btn:active {
    background: var(--bg-3);
  }

  .reset-btn.danger {
    color: var(--danger);
    border-color: rgba(239, 68, 68, 0.3);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-3);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 12px 18px;
    border-radius: 12px;
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    box-shadow: 0 0 20px var(--accent-glow);
    white-space: nowrap;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-10px);
  }

  .toast .xp-gain {
    color: var(--xp);
    font-weight: 700;
  }

  /* ===========================================
     Q-TASK STEPPER (partial credit UI)
     =========================================== */
  .task.q-task {
    display: block;
    padding: 12px 14px;
  }

  .task.q-task .q-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .task.q-task .task-content {
    margin-bottom: 8px;
  }

  .q-stepper {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 8px;
    align-items: center;
    padding: 10px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-top: 8px;
  }

  .q-step-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--bg-3);
    color: var(--text);
    font-family: 'SF Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .q-step-btn:active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--bg);
  }

  .q-step-btn.minus {
    color: var(--text-dim);
  }

  .q-step-display {
    text-align: center;
    padding: 0 4px;
  }

  .q-step-num {
    font-size: 18px;
    color: var(--text);
    font-weight: 500;
    font-family: 'SF Mono', monospace;
  }

  .q-step-num em {
    color: var(--accent);
    font-style: italic;
  }

  .q-step-num.complete em {
    color: var(--success);
  }

  .q-step-num.over em {
    color: var(--xp);
  }

  .q-step-label {
    font-family: 'SF Mono', monospace;
    font-size: 8px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .q-task.complete {
    background: linear-gradient(135deg, rgba(74, 222, 128, 0.08), var(--bg-2));
    border-color: rgba(74, 222, 128, 0.3);
  }

  .q-task.partial {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.05), var(--bg-2));
    border-left: 3px solid var(--warn);
  }

  /* Mini progress bar for stepper */
  .q-mini-bar {
    grid-column: 1 / -1;
    height: 4px;
    background: var(--bg);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 8px;
  }

  .q-mini-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  .q-mini-bar-fill.complete {
    background: var(--success);
  }

  /* ===========================================
     Q-DEBT BADGE & CATCH-UP SECTION
     =========================================== */
  .debt-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(245, 158, 11, 0.15));
    border: 1px solid rgba(245, 158, 11, 0.4);
    border-radius: 10px;
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    color: var(--warn);
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-left: 6px;
  }

  .debt-badge::before {
    content: '⚠';
    font-size: 10px;
  }

  .debt-banner {
    margin: 16px 0;
    padding: 14px;
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.03));
    border: 1px solid rgba(245, 158, 11, 0.3);
    border-left: 3px solid var(--warn);
    border-radius: 10px;
  }

  .debt-banner-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .debt-label {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--warn);
    text-transform: uppercase;
    font-weight: 700;
  }

  .debt-label::before {
    content: '⚠ ';
  }

  .debt-num {
    font-size: 20px;
    color: var(--warn);
    font-style: italic;
    font-weight: 500;
  }

  .debt-text {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .debt-text em {
    color: var(--text);
    font-style: italic;
  }

  /* Catch-up day indicator */
  .catch-up-indicator {
    display: inline-block;
    padding: 2px 6px;
    background: rgba(245, 158, 11, 0.15);
    color: var(--warn);
    font-family: 'SF Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    border-radius: 4px;
    border: 1px solid rgba(245, 158, 11, 0.3);
    font-weight: 700;
    margin-left: 4px;
  }

  .catch-up-suggestion {
    background: var(--bg-1);
    border: 1px dashed rgba(245, 158, 11, 0.4);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.4;
  }

  .catch-up-suggestion em {
    color: var(--warn);
    font-style: italic;
    font-weight: 600;
  }

  /* ===========================================
     ANKI DAILY CARD
     =========================================== */
  .anki-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.08), var(--bg-2));
    border: 1px solid rgba(168, 85, 247, 0.2);
    border-left: 3px solid var(--boss);
    border-radius: 10px;
    margin-bottom: 16px;
    cursor: pointer;
    min-height: 44px;
    transition: all 0.2s;
    position: relative;
  }

  .anki-card:active {
    transform: scale(0.99);
  }

  .anki-card.done {
    background: linear-gradient(135deg, rgba(74, 222, 128, 0.08), var(--bg-2));
    border-color: rgba(74, 222, 128, 0.3);
    border-left-color: var(--success);
  }

  .anki-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--boss), #6d28d9);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
  }

  .anki-card.done .anki-icon {
    background: linear-gradient(135deg, var(--success), #15803d);
    box-shadow: 0 0 12px var(--success-glow);
  }

  .anki-content {
    flex: 1;
    min-width: 0;
  }

  .anki-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.2;
  }

  .anki-card.done .anki-title {
    color: var(--text-dim);
  }

  .anki-meta {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .anki-streak-badge {
    color: var(--boss);
    font-weight: 700;
  }

  .anki-card.done .anki-streak-badge {
    color: var(--success);
  }

  .anki-checkbox {
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--border-strong);
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    background: var(--bg-3);
  }

  .anki-card.done .anki-checkbox {
    background: var(--success);
    border-color: var(--success);
    box-shadow: 0 0 12px var(--success-glow);
  }

  .anki-checkbox::after {
    content: '';
    width: 5px;
    height: 9px;
    border: solid var(--bg);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) scale(0);
    margin-top: -2px;
    transition: transform 0.2s;
  }

  .anki-card.done .anki-checkbox::after {
    transform: rotate(45deg) scale(1);
  }

  /* ===========================================
     WEEKLY PROGRESS WIDGET
     =========================================== */
  .weekly-progress {
    background: linear-gradient(135deg, var(--bg-2), var(--bg-1));
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .weekly-progress::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: 100%;
    background: var(--accent);
  }

  .weekly-progress.on-pace::before { background: var(--success); box-shadow: 0 0 8px var(--success-glow); }
  .weekly-progress.ahead::before { background: var(--xp); box-shadow: 0 0 8px var(--xp-glow); }
  .weekly-progress.slightly-behind::before { background: var(--warn); }
  .weekly-progress.behind::before { background: var(--danger); box-shadow: 0 0 8px rgba(239, 68, 68, 0.5); }

  .wp-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .wp-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--accent);
    text-transform: uppercase;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .wp-label::before {
    content: '⬢';
  }

  .wp-status {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 8px;
  }

  .wp-status.on-pace { background: rgba(74, 222, 128, 0.15); color: var(--success); }
  .wp-status.ahead { background: rgba(96, 165, 250, 0.15); color: var(--xp); }
  .wp-status.slightly-behind { background: rgba(245, 158, 11, 0.15); color: var(--warn); }
  .wp-status.behind { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

  .wp-numbers {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 8px 0 6px;
  }

  .wp-progress-num {
    font-size: 22px;
    color: var(--text);
    font-style: italic;
    font-weight: 400;
    line-height: 1;
  }

  .wp-progress-num em {
    color: var(--accent);
    font-style: italic;
    font-weight: 500;
  }

  .wp-target-num {
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  .wp-bar-container {
    position: relative;
    height: 10px;
    margin: 8px 0 4px;
  }

  .wp-bar {
    height: 100%;
    background: var(--bg);
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
  }

  .wp-bar-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }

  .wp-bar-fill.on-pace {
    background: linear-gradient(90deg, #15803d, var(--success));
    box-shadow: 0 0 8px var(--success-glow);
  }
  .wp-bar-fill.ahead {
    background: linear-gradient(90deg, #2563eb, var(--xp));
    box-shadow: 0 0 10px var(--xp-glow);
  }

// ===========================================
// STORAGE
// ===========================================
function defaultState() {
  return {
    version: STORAGE_VERSION,
    tasks: {},
    qProgress: {},
    extraQbank: 0,
    ccs: 0,
    xp: 0,
    streakDays: [],
    ankiDays: [],
    completedDays: [],
    scores: {},
    minimumDays: []
  };
}

function sumQProgress(progressObj) {
  return Object.values(progressObj || {}).reduce((sum, val) => sum + (Number(val) || 0), 0);
}

function normalizeState(parsed) {
  const base = defaultState();
  const qProgress = parsed.qProgress || {};
  const migratedExtraQbank = parsed.extraQbank ?? Math.max(0, (Number(parsed.qbank) || QBANK_BASELINE) - QBANK_BASELINE - sumQProgress(qProgress));

  return {
    ...base,
    ...parsed,
    version: STORAGE_VERSION,
    tasks: parsed.tasks || {},
    qProgress,
    extraQbank: migratedExtraQbank,
    ccs: parsed.ccs ?? 0,
    xp: parsed.xp ?? 0,
    streakDays: parsed.streakDays || [],
    ankiDays: parsed.ankiDays || [],
    completedDays: parsed.completedDays || [],
    scores: parsed.scores || {},
    minimumDays: parsed.minimumDays || []
  };
}

function loadState() {
  const keysToTry = [STORAGE_KEY, ...OLD_STORAGE_KEYS];

  for (const key of keysToTry) {
    const raw = localStorage.getItem(key);
    if (!raw) continue;

    try {
      const parsed = JSON.parse(raw);
      const normalized = normalizeState(parsed);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
      if (key !== STORAGE_KEY) {
        localStorage.setItem(`${key}_migrated_backup_${Date.now()}`, raw);
      }
      return normalized;
    } catch (e) {
      localStorage.setItem(`${key}_corrupt_backup_${Date.now()}`, raw);
      console.warn('Save file unreadable. Raw backup preserved.', e);
    }
  }

  return defaultState();
}

function saveState() {
  try {
    state.version = STORAGE_VERSION;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('Unable to save state', e);
    showToast('⚠ Save failed — storage may be full');
  }
}

let state = loadState();

function getQbankDone() {
  return Math.max(0, Math.min(QBANK_TOTAL, QBANK_BASELINE + sumQProgress(state.qProgress) + (Number(state.extraQbank) || 0)));
}

function getQbankRemaining() {
  return Math.max(0, QBANK_TOTAL - getQbankDone());
}

function exportSave() {
  const payload = JSON.stringify({ ...state, exportedAt: new Date().toISOString() }, null, 2);
  const blob = new Blob([payload], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `step3-ascent-save-${getTodayKey()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('⬢ Save exported');
}

function copyBackup() {
  const payload = JSON.stringify({ ...state, exportedAt: new Date().toISOString() });
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(payload).then(() => showToast('⬢ Backup copied')).catch(() => showToast('⚠ Copy failed'));
  } else {
    prompt('Copy this backup text:', payload);
  }
}

function triggerImportSave() {
  document.getElementById('importSaveInput').click();
}

function importSaveFile(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      localStorage.setItem(`${STORAGE_KEY}_pre_import_backup_${Date.now()}`, JSON.stringify(state));
      state = normalizeState(imported);
      saveState();
      rerender();
      showToast('⬢ Save imported');
    } catch (err) {
      console.warn('Import failed', err);
      showToast('⚠ Import failed');
    } finally {
      event.target.value = '';
    }
  };
  reader.readAsText(file);
}


function hapticTick() {
  if (navigator.vibrate) navigator.vibrate(10);
}

// CALCULATIONS
// ===========================================
function getAllTasks() {
  const all = [];
  WEEKS.forEach(w => {
    w.dayPlans.forEach(dp => {
      dp.tasks.forEach(t => all.push({ ...t, date: dp.date, weekN: w.n }));
    });
  });
  return all;
}

function getTotalTasks() {
  return getAllTasks().length;
}

function getDoneTasks() {
  return Object.values(state.tasks).filter(v => v).length;
}

function getProgressPct() {
  const total = getTotalTasks();
  if (total === 0) return 0;
  return Math.round((getDoneTasks() / total) * 100);
}

function getRank() {
  const pct = getProgressPct();
  for (let i = RANKS.length - 1; i >= 0; i--) {
    if (pct >= RANKS[i].min) return RANKS[i];
  }
  return RANKS[0];
}

function getLevel() {
  // Level up every 250 XP, with diminishing curve later
  const xp = state.xp;
  if (xp < 250) return { level: 1, xpInLevel: xp, xpNeeded: 250 };
  if (xp < 600) return { level: 2, xpInLevel: xp - 250, xpNeeded: 350 };
  if (xp < 1100) return { level: 3, xpInLevel: xp - 600, xpNeeded: 500 };
  if (xp < 1800) return { level: 4, xpInLevel: xp - 1100, xpNeeded: 700 };
  if (xp < 2700) return { level: 5, xpInLevel: xp - 1800, xpNeeded: 900 };
  if (xp < 3800) return { level: 6, xpInLevel: xp - 2700, xpNeeded: 1100 };
  if (xp < 5100) return { level: 7, xpInLevel: xp - 3800, xpNeeded: 1300 };
  if (xp < 6600) return { level: 8, xpInLevel: xp - 5100, xpNeeded: 1500 };
  if (xp < 8300) return { level: 9, xpInLevel: xp - 6600, xpNeeded: 1700 };
  return { level: 10, xpInLevel: 0, xpNeeded: 1, max: true };
}

function getCurrentDate() {
  return new Date(); // real time
}

function getTodayKey() {
  return dateKey(getCurrentDate());
}

function getDayPlan(dateKeyStr) {
  for (const w of WEEKS) {
    for (const dp of w.dayPlans) {
      if (dp.date === dateKeyStr) return { week: w, dayPlan: dp };
    }
  }
  return null;
}

function getCurrentWeek() {
  const today = getTodayKey();
  for (const w of WEEKS) {
    if (today >= w.start && today <= w.end) return w;
  }
  // Before plan start
  if (today < WEEKS[0].start) return WEEKS[0];
  // After plan end
  return WEEKS[WEEKS.length - 1];
}

function daysUntil(targetDate) {
  const ms = targetDate - getCurrentDate();
  return Math.ceil(ms / (1000 * 60 * 60 * 24));
}

function getNextBoss() {
  const today = getCurrentDate();
  // Bosses are: NBMEs and test days
  const bosses = [
    { name: 'NBME Free 120', date: new Date('2026-05-16T08:00:00'), type: 'nbme' },
    { name: 'UWSA 1', date: new Date('2026-05-30T08:00:00'), type: 'nbme' },

function weekProgress(week) {
  let total = 0, done = 0;
  week.dayPlans.forEach(dp => {
    dp.tasks.forEach(t => {
      total++;
      if (state.tasks[t.id]) done++;

  return { total, done, pct: total > 0 ? Math.round((done/total)*100) : 0 };
}

// ===========================================
// Q-DEBT SYSTEM
// ===========================================
// Q progress is task-level. Global QBank total is derived from:
// baseline completed before the plan + all task progress + extra manual QBank adjustments.
// Active debt only looks back 7 days so the number stays actionable.
// Overflow on catch-up days is credited against recent missed targets.

function getQTasks() {
  const all = [];
  WEEKS.forEach(w => {
    w.dayPlans.forEach(dp => {
      dp.tasks.forEach(t => {
        if (t.qTarget && t.qTarget > 0) {
          all.push({ ...t, date: dp.date, weekN: w.n });
        }
      });
    });
  });
  return all;
}

function getQProgress(taskId) {
  return Math.max(0, Number(state.qProgress[taskId]) || 0);
}

function getRecentDebtWindowStart() {
  return dateKey(dateAdd(getCurrentDate(), -7));
}

function getQDebtDetails() {
  const today = getTodayKey();
  const recentStart = getRecentDebtWindowStart();
  let recentTarget = 0;
  let recentProgress = 0;
  let archivedTarget = 0;
  let archivedProgress = 0;
  let catchUpCredit = 0;

  getQTasks().forEach(t => {
    const progress = getQProgress(t.id);
    if (t.date < today && t.date >= recentStart) {
      recentTarget += t.qTarget;
      recentProgress += Math.min(progress, t.qTarget);
    } else if (t.date < recentStart) {
      archivedTarget += t.qTarget;
      archivedProgress += Math.min(progress, t.qTarget);
    }

    if (t.catchUpEligible && t.date >= today) {
      catchUpCredit += Math.max(0, progress - t.qTarget);
    }
  });

  const activeDebtBeforeCredit = Math.max(0, recentTarget - recentProgress);
  const activeDebt = Math.max(0, activeDebtBeforeCredit - catchUpCredit);
  const archivedDebt = Math.max(0, archivedTarget - archivedProgress);

  return {
    activeDebt,
    archivedDebt,
    activeDebtBeforeCredit,
    catchUpCredit,
    recentTarget,
    recentProgress
  };
}

function getQDebt() {
  return getQDebtDetails().activeDebt;
}

function getArchivedQDebt() {
  return getQDebtDetails().archivedDebt;
}

function getCatchUpEligibleDays() {
  const today = getTodayKey();
  const result = [];
  WEEKS.forEach(w => {
    w.dayPlans.forEach(dp => {
      if (dp.date >= today) {
        dp.tasks.forEach(t => {
          if (t.catchUpEligible) {
            result.push({ date: dp.date, label: dp.label, taskId: t.id, weekN: w.n });
          }
        });
      }
    });
  });
  return result;
}

function getNextCatchUpDay() {
  const days = getCatchUpEligibleDays();
  return days.length > 0 ? days[0] : null;
}

function getWeekQStats(week) {
  let target = 0;
  let progress = 0;
  let targetThruToday = 0;
  let progressThruToday = 0;
  const today = getTodayKey();

  week.dayPlans.forEach(dp => {
    dp.tasks.forEach(t => {
      if (t.qTarget && t.qTarget > 0) {
        const taskProgress = getQProgress(t.id);
        target += t.qTarget;
        progress += taskProgress;
        if (dp.date <= today) {
          targetThruToday += t.qTarget;
          progressThruToday += taskProgress;
        }
      }
    });
  });

  const paceDelta = progressThruToday - targetThruToday;
  let paceStatus = 'on-pace';
  if (paceDelta < -20) paceStatus = 'behind';
  else if (paceDelta < 0) paceStatus = 'slightly-behind';
  else if (paceDelta > 20) paceStatus = 'ahead';

  return {
    target,
    progress,
    targetThruToday,
    progressThruToday,
    paceDelta,
    paceStatus,
    pct: target > 0 ? (progress / target) * 100 : 0,
    pacePct: targetThruToday > 0 ? (progressThruToday / targetThruToday) * 100 : 100
  };
}

// ===========================================
// ANKI DAILY TRACKING
// ===========================================
function isAnkiDoneToday() {
  return state.ankiDays.includes(getTodayKey());
}

function isAnkiDoneOnDate(dateStr) {
  return state.ankiDays.includes(dateStr);
}

function toggleAnki(dateStr) {
  hapticTick();
  const targetDate = dateStr || getTodayKey();
  if (state.ankiDays.includes(targetDate)) {
    state.ankiDays = state.ankiDays.filter(d => d !== targetDate);
    deductXP(10);
  } else {
    state.ankiDays.push(targetDate);
    awardXP(10, '🃏 Anki done');
  }
  updateStreak();
  saveState();
  rerender();
}

function calcAnkiStreak() {
  let streak = 0;
  let d = getCurrentDate();
  // Today doesn't break the streak if not done yet — start from yesterday
  if (!isAnkiDoneOnDate(dateKey(d))) {
    d = dateAdd(d, -1);
  }
  while (true) {
    const k = dateKey(d);
    if (state.ankiDays.includes(k)) {
      streak++;
      d = dateAdd(d, -1);
    } else {
      break;
    }
  }
  return streak;
}

function adjustQProgress(taskId, delta, qTarget) {
  hapticTick();
  const current = getQProgress(taskId);
  const newVal = Math.max(0, current + delta);
  state.qProgress[taskId] = newVal;

  if (delta > 0) {
    awardXP(Math.floor(delta / 5), `+${delta} Qs logged`);
  } else if (delta < 0) {
    deductXP(Math.floor(Math.abs(delta) / 5));
  }

  if (newVal >= qTarget && !state.tasks[taskId]) {
    state.tasks[taskId] = true;
    awardXP(5, '✓ Task complete');
  } else if (newVal < qTarget && state.tasks[taskId]) {
    state.tasks[taskId] = false;
  }

  updateStreak();
  saveState();
  rerender();
}

// ===========================================
// XP & STREAKS
// ===========================================
function awardXP(amount, label) {
  state.xp += amount;
  saveState();
  showToast(`<span class="xp-gain">+${amount} XP</span> ${label || ''}`);
}

function deductXP(amount) {
  state.xp = Math.max(0, state.xp - amount);
  saveState();
}

function updateStreak() {
  const today = getTodayKey();
  // A day "counts" toward streak if at least one task is done OR Q progress logged
  const todayPlan = getDayPlan(today);
  if (!todayPlan) return;

  const anyDone = todayPlan.dayPlan.tasks.some(t => state.tasks[t.id] || (t.qTarget && getQProgress(t.id) > 0));
  if (anyDone && !state.streakDays.includes(today)) {
    state.streakDays.push(today);
    saveState();
  } else if (!anyDone && state.streakDays.includes(today)) {
    state.streakDays = state.streakDays.filter(d => d !== today);
    saveState();
  }
}

function calcCurrentStreak() {
  // Count back consecutive days from today
  let streak = 0;
  let d = getCurrentDate();
  while (true) {
    const k = dateKey(d);
    if (state.streakDays.includes(k)) {
      streak++;
      d = dateAdd(d, -1);
    } else {
      // Today not yet completed but yesterday was - still count from yesterday
      if (streak === 0 && k === getTodayKey()) {
        d = dateAdd(d, -1);
        continue;
      }
      break;
    }
  }
  return streak;
}

function renderTaskHTML(t, isDay) {
  const isDone = !!state.tasks[t.id];

  // Q-task with stepper
  if (t.qTarget && t.qTarget > 0) {
    const progress = getQProgress(t.id);
    const pct = Math.min(100, (progress / t.qTarget) * 100);
    const isComplete = progress >= t.qTarget;
    const isPartial = progress > 0 && progress < t.qTarget;
    const isOver = progress > t.qTarget;

    const classes = ['task', 'q-task'];
    if (isComplete) classes.push('complete');
    else if (isPartial) classes.push('partial');
    if (t.priority) classes.push('priority');

    const xpTag = t.xp ? `<span class="xp-tag">+${t.xp} XP</span>` : '';
    const numClass = isComplete && !isOver ? 'complete' : (isOver ? 'over' : '');

    return `
      <div class="${classes.join(' ')}">
        <div class="q-row">
          <div class="checkbox" onclick="toggleQTaskComplete('${t.id}', ${t.qTarget}, ${t.xp || 25})"></div>
          <div class="task-content">
            <div class="task-text">${t.text}</div>
            <div class="task-meta">${xpTag}${t.meta ? `<span>${t.meta}</span>` : ''}<span style="color: var(--text-dim);">target: ${t.qTarget}</span></div>
          </div>
        </div>
        <div class="q-stepper">
          <button class="q-step-btn minus" onclick="adjustQProgress('${t.id}', -5, ${t.qTarget})">−5</button>
          <div class="q-step-display">
            <div class="q-step-num ${numClass}"><em>${progress}</em> / ${t.qTarget}</div>
            <div class="q-step-label">questions done</div>
          </div>
          <button class="q-step-btn" onclick="adjustQProgress('${t.id}', 5, ${t.qTarget})">+5</button>
          <div class="q-mini-bar">
            <div class="q-mini-bar-fill ${isComplete ? 'complete' : ''}" style="width: ${pct}%"></div>
          </div>
        </div>
      </div>
    `;
  }

  // Regular binary task
  const classes = ['task'];
  if (isDone) classes.push('done');
  if (t.priority) classes.push('priority');
  if (t.assessment) classes.push('assessment');

  const xpTag = t.xp ? `<span class="xp-tag">+${t.xp} XP</span>` : '';

  return `
    <div class="${classes.join(' ')}" onclick="toggleTask('${t.id}', ${t.xp || 10})">
      <div class="checkbox"></div>
      <div class="task-content">
        <div class="task-text">${t.text}</div>
        <div class="task-meta">${xpTag}${t.meta ? `<span>${t.meta}</span>` : ''}</div>
      </div>
    </div>
  `;
}

// Toggle a Q-task's "complete" checkbox directly (force complete or reset)
function toggleQTaskComplete(id, qTarget, xp) {
  hapticTick();
  const wasDone = !!state.tasks[id];
  if (wasDone) {
    state.tasks[id] = false;
    state.qProgress[id] = 0;
    deductXP(xp || 10);
  } else {
    const current = getQProgress(id);
    const remaining = Math.max(0, qTarget - current);
    state.qProgress[id] = Math.max(current, qTarget);
    awardXP(Math.floor(remaining / 5) + 5, '✓ Filled to target');
    state.tasks[id] = true;
  }
  updateStreak();
  saveState();
  rerender();
}

  const daysLeft = Math.max(0, daysUntil(TEST_DATE));

  const qTotal = QBANK_TOTAL;
  const qDone = getQbankDone();
  const qRemaining = getQbankRemaining();
  const qFinishTarget = new Date('2026-06-07T23:59:59'); // End of elective week
  const qDaysLeft = Math.max(1, Math.ceil((qFinishTarget - today) / (1000 * 60 * 60 * 24)));
  const qNeededDaily = Math.ceil(qRemaining / qDaysLeft);

  const expectedQ = Math.round(QBANK_BASELINE + (qTotal - QBANK_BASELINE) * (Math.min(daysElapsed, 35) / 35));

      <div class="pace-bar">
        <div class="pace-fill ${paceClass}" style="width: ${Math.min(100, Math.max(5, daysElapsed/totalDays*100))}%"></div>
      </div>
      <div class="pace-marker">Day ${daysElapsed} of ${totalDays} · ${Math.round(daysElapsed/totalDays*100)}% through plan</div>
    </div>
  `;

  // Stats grid
  html += `
    <div class="stats-grid">
      <div class="stat-card xp">
        <div class="stat-card-label">Avg Qs/Day</div>
        <div class="stat-card-value xp-color">${avgQPerDay}</div>
        <div class="stat-card-sub">Since plan start</div>
      </div>
      <div class="stat-card ${qNeededDaily > avgQPerDay + 10 ? 'warn' : ''}">
        <div class="stat-card-label">Required/Day</div>
        <div class="stat-card-value ${qNeededDaily > avgQPerDay + 10 ? 'warn' : 'gold'}">${qNeededDaily}</div>
        <div class="stat-card-sub">To finish by Jun 7</div>
      </div>
      <div class="stat-card ${qDelta < 0 ? 'warn' : 'green'}">
        <div class="stat-card-label">QBank Delta</div>
        <div class="stat-card-value ${qDelta < 0 ? 'warn' : 'green'}">${qDelta >= 0 ? '+' : ''}${qDelta}</div>
        <div class="stat-card-sub">vs. expected</div>
      </div>
      <div class="stat-card ${taskDelta < 0 ? 'warn' : 'green'}">
        <div class="stat-card-label">Tasks Delta</div>
        <div class="stat-card-value ${taskDelta < 0 ? 'warn' : 'green'}">${taskDelta >= 0 ? '+' : ''}${taskDelta}</div>
        <div class="stat-card-sub">vs. expected</div>
      </div>
    </div>
  `;

  // QBank counter
  const qPct = Math.min(100, (qDone / qTotal) * 100);
  const debtForBadge = getQDebt();
  const debtBadgeHtml = debtForBadge > 0 ? `<span class="debt-badge">${debtForBadge} debt</span>` : '';
  html += `
    <div class="counter-card">
      <div class="counter-header">
        <div class="counter-title">⬢ UWorld QBank${debtBadgeHtml}</div>
        <div class="counter-progress"><em>${qDone}</em> / ${qTotal} (${Math.round(qPct)}%)</div>
      </div>
      <div class="counter-bar">
        <div class="counter-bar-fill qb" style="width: ${qPct}%"></div>
      </div>
      <div class="counter-buttons">
        <button class="counter-btn minus" onclick="adjustQbank(-10)">−10</button>
        <button class="counter-btn" onclick="adjustQbank(10)">+10</button>
        <button class="counter-btn" onclick="adjustQbank(25)">+25</button>
        <button class="counter-btn" onclick="adjustQbank(40)">+40</button>
        <button class="counter-btn" onclick="adjustQbank(50)">+50</button>
      </div>
    </div>
  `;

  // CCS counter
  const ccsPct = Math.min(100, (ccsDone / ccsTotal) * 100);
  html += `
    <div class="counter-card">
      <div class="counter-header">
        <div class="counter-title">⚔ CCS Cases</div>
        <div class="counter-progress"><em>${ccsDone}</em> / ${ccsTotal} (${Math.round(ccsPct)}%)</div>
      </div>
      <div class="counter-bar">
        <div class="counter-bar-fill ccs" style="width: ${ccsPct}%"></div>
      </div>
      <div class="counter-buttons">
        <button class="counter-btn minus" onclick="adjustCcs(-1)">−1</button>
        <button class="counter-btn" onclick="adjustCcs(1)">+1</button>
        <button class="counter-btn" onclick="adjustCcs(2)">+2</button>
        <button class="counter-btn" onclick="adjustCcs(3)">+3</button>
        <button class="counter-btn" onclick="adjustCcs(5)">+5</button>
      </div>
    </div>
  `;

  // Lifetime XP
  html += `
    <div class="stats-grid" style="margin-top: 16px;">
      <div class="stat-card xp">
        <div class="stat-card-label">Total XP</div>
        <div class="stat-card-value xp-color">${state.xp.toLocaleString()}</div>
        <div class="stat-card-sub">Lifetime earned</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Plan Progress</div>
        <div class="stat-card-value gold">${getProgressPct()}%</div>
        <div class="stat-card-sub">${doneTasks}/${totalTasks} tasks</div>
      </div>
    </div>
  `;

  // Anki streak card
  const ankiStreakNow = calcAnkiStreak();
  const ankiTotal = state.ankiDays.length;
  html += `
    <div class="counter-card" style="border-left: 3px solid var(--boss); border-left-style: solid;">
      <div class="counter-header">
        <div class="counter-title" style="color: var(--boss);">🃏 Anki Streak</div>
        <div class="counter-progress"><em style="color: var(--boss);">${ankiStreakNow}</em> day${ankiStreakNow === 1 ? '' : 's'} · ${ankiTotal} total</div>
      </div>
      <div style="font-family: 'SF Mono', monospace; font-size: 10px; color: var(--text-dim); margin-bottom: 4px;">
        ${ankiStreakNow >= 7 ? '🔥 Strong consistency — keep it going.' : ankiStreakNow >= 3 ? 'Building momentum.' : ankiStreakNow > 0 ? 'Just started — protect the streak.' : 'Tap the Anki card on Today to start.'}
      </div>
    </div>
  `;

  html += `
    <div class="backup-row">
      <button class="reset-btn" onclick="exportSave()">Export Save</button>
      <button class="reset-btn" onclick="triggerImportSave()">Import Save</button>
      <button class="reset-btn" onclick="copyBackup()">Copy Backup</button>
      <button class="reset-btn" onclick="markMinimumDay()">Minimum Day</button>
    </div>
  `;

  container.innerHTML = html;
}

// ===========================================
// INTERACTIONS
// ===========================================
function toggleTask(id, xp) {
  hapticTick();
  const wasDone = !!state.tasks[id];
  state.tasks[id] = !wasDone;

  if (state.tasks[id]) {
    awardXP(xp || 10);
  } else {
    deductXP(xp || 10);
  }

  updateStreak();
  saveState();
  rerender();
}

function toggleWeek(n) {
  const card = document.getElementById('week-' + n);
  card.classList.toggle('expanded');
}

function adjustQbank(delta) {
  hapticTick();
  state.extraQbank = Math.max(0, Math.min(QBANK_TOTAL - QBANK_BASELINE - sumQProgress(state.qProgress), (Number(state.extraQbank) || 0) + delta));
  saveState();
  if (delta > 0) awardXP(Math.floor(delta / 5), `${delta} extra Qs logged`);
  rerender();
}

function adjustCcs(delta) {
  hapticTick();
  state.ccs = Math.max(0, Math.min(30, state.ccs + delta));
  saveState();
  if (delta > 0) awardXP(delta * 15, `${delta} CCS case${delta > 1 ? 's' : ''} logged`);
  rerender();
}

function quickQbank() {
  const today = getTodayKey();
  const plan = getDayPlan(today);
  if (plan) {
    const qTask = plan.dayPlan.tasks.find(t => t.qTarget && getQProgress(t.id) < t.qTarget);
    if (qTask) {
      adjustQProgress(qTask.id, 25, qTask.qTarget);
      return;
    }
    const catchUpTask = plan.dayPlan.tasks.find(t => t.qTarget && t.catchUpEligible);
    if (catchUpTask && getQDebt() > 0) {
      adjustQProgress(catchUpTask.id, 25, catchUpTask.qTarget);
      return;
    }
  }
  adjustQbank(25);
}
function markMinimumDay() {
  const today = getTodayKey();
  const plan = getDayPlan(today);
  if (!plan) return;
  if (!state.minimumDays.includes(today)) state.minimumDays.push(today);
  if (!state.streakDays.includes(today)) state.streakDays.push(today);
  awardXP(15, 'Minimum day secured');
  saveState();
  rerender();
}

function quickCCS() { adjustCcs(1); }

function switchTab(name) {
  document.querySelectorAll('.main-tab').forEach((t, i) => {
    const tabName = ['today', 'plan', 'stats'][i];
    t.classList.toggle('active', tabName === name);
  });
  document.querySelectorAll('.bottom-nav-btn').forEach((t, i) => {
    const tabName = ['today', 'plan', 'stats'][i];
    t.classList.toggle('active', tabName === name);
  });
  document.querySelectorAll('.panel').forEach(p => {
    p.classList.toggle('active', p.id === 'panel-' + name);
  });
}

function resetCurrentWeek() {
  const cw = getCurrentWeek();
  if (!confirm(`Reset all checkboxes for Week ${cw.n} (${cw.title})?`)) return;
  cw.dayPlans.forEach(dp => {
    dp.tasks.forEach(t => { delete state.tasks[t.id]; delete state.qProgress[t.id]; });
  });
  saveState();
  rerender();
}

function resetAll() {
  if (!confirm('Reset ALL data? This will clear all task progress, XP, and counters. Cannot be undone.')) return;
  if (!confirm('Are you really sure? This will delete everything.')) return;
  localStorage.setItem(`${STORAGE_KEY}_pre_reset_backup_${Date.now()}`, JSON.stringify(state));
  state = defaultState();
  saveState();
  rerender();
}

// ===========================================
// TOAST
// ===========================================
let toastTimer = null;
function showToast(html) {
  const t = document.getElementById('toast');
  t.innerHTML = html;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ===========================================
// MASTER RERENDER
// ===========================================
function rerender() {
  renderHeader();
  renderHunter();
  renderBossBanner();
  renderToday();
  renderPlan();
  renderStats();
}

// Init
rerender();

// Refresh every minute (for countdown updates)
setInterval(() => {
  renderHeader();
  renderBossBanner();
}, 60000);
</script>
</body>
</html>
